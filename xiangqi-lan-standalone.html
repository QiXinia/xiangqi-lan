      acts.appendChild(b);
    };
    if (this.mode === 'lan' && this.mySide !== 'spec') {
      addAct('悔', '悔棋', () => this._reqUndo());
      addAct('和', '求和', () => this._reqDraw());
      addAct('降', '认输', () => this._resign(), 'danger');
      addAct('聊', '聊天', () => this._openChat());
      addAct('谱', '棋谱', () => this._openMoves());
    } else if (this.mySide === 'spec') {
      addAct('聊', '聊天', () => this._openChat());
      addAct('转', '翻转视角', () => this._flipView());
      addAct('谱', '棋谱', () => this._openMoves());
      addAct('退', '退出观战', () => this.opts.onExit && this.opts.onExit());
    } else if (this.mode === 'puzzle') {
      addAct('悔', '重摆', () => this._undoLocal());
      addAct('示', '提示', () => this._hint());
      addAct('谱', '棋谱', () => this._openMoves());
      addAct('退', '退出', () => this.opts.onExit && this.opts.onExit(), 'danger');
    } else if (this.mode === 'free') {
      addAct('悔', '悔棋', () => this._undoLocal());
      addAct('转', '翻转视角', () => this._flipView());
      addAct('谱', '棋谱', () => this._openMoves());
      addAct('退', '退出', () => this.opts.onExit && this.opts.onExit(), 'danger');
    } else if (this.mode === 'local') {
      // 同台对坐: 红/黑各一组工具按钮, 分列棋盘两头(红组在底部朝红、黑组在顶部旋转180°朝黑),
      // 仅当前行棋方那组可点, 避免对手隔着棋盘误触。
      acts.classList.add('side-r'); this.actR = acts;
      const actsB = h('div', { class: 'action-bar side-b' }); this.actB = actsB;
      const fillDual = (box) => {
        const da = (icon, text, fn, cls) => {
          box.appendChild(h('button', { class: 'act ' + (cls || ''), onclick: fn }, [h('div', { class: 'act-ic' }, icon), h('span', {}, text)]));
        };
        da('悔', '悔棋', () => this._undoLocal());
        da('交', '交接', () => this._passHandset());
        da('和', '和棋', () => confirmBox({
          title: '双方同意和棋？', body: '确认后本局作和。', okText: '确认和棋', cancelText: '继续对局',
          onOk: () => this.finish('draw', 'agreement')
        }));
        da('降', '认输', () => this._resign(), 'danger');
        da('谱', '棋谱', () => this._openMoves());
        da('退', '退出', () => this.opts.onExit && this.opts.onExit(), 'danger');
      };
      fillDual(acts); fillDual(actsB);
      wrap.insertBefore(actsB, wrap.querySelector('.board-area'));
    } else {
      addAct('悔', '悔棋', () => this._undoLocal());
      addAct('示', '提示', () => this._hint());
      addAct('和', '求和', () => this.finish('draw', 'agreement'));
      addAct('降', '认输', () => this._resign(), 'danger');
      addAct('谱', '棋谱', () => this._openMoves());
    }
    wrap.appendChild(acts);
    // 观战 AI 对战 / 残局 AI 演示: 专用控制条(暂停/继续/单步/调速/重开/换配置), 不遮挡棋盘
    if (this.mode === 'spectate' || this.pzMode) {
      const ctl = h('div', { class: 'spec-ctlbar' });
      this.specPauseBtn = h('button', { onclick: () => this._specTogglePause() }, '暂停');
      this.specStepBtn = h('button', { onclick: () => this._specStep() }, '单步');
      const speedBox = h('span', { class: 'spec-speed' });
      this.specSpeedBtns = {};
      for (const [k, lbl] of [['slow', '慢'], ['mid', '中'], ['fast', '快']]) {
        const b = h('button', { 'data-sp': k, onclick: () => this._specSpeed(k) }, lbl);
        this.specSpeedBtns[k] = b; speedBox.appendChild(b);
      }
      ctl.appendChild(this.specPauseBtn);
      ctl.appendChild(this.specStepBtn);
      ctl.appendChild(speedBox);
      ctl.appendChild(h('button', { onclick: () => this.opts.onRestart && this.opts.onRestart() }, '重开'));
      ctl.appendChild(h('button', { onclick: () => this.opts.onExit && this.opts.onExit() }, '换配置/退出'));
      wrap.appendChild(ctl);
      this._specMarkSpeed();
    }
    // 电脑端宽屏三栏: 常驻回合信息条 + 走子记录容器。窄屏由 CSS 强制 display:none,
    // 不参与移动端纵向栈布局(节点为新增, 不影响既有 DOM 顺序)。
    this.turnInfo = h('div', { class: 'turn-info' });
    wrap.appendChild(this.turnInfo);
    this.moveLog = h('div', { class: 'move-log' });
    wrap.appendChild(this.moveLog);
    this.container.appendChild(wrap);
    this.banner = h('div', { class: 'peek-banner', style: 'display:none' });
    wrap.insertBefore(this.banner, this.bhost.parentElement);
  }

  // ---------------- 走子 ----------------
  onBoardMove(from, to) {
    if (this.ended) return;
    if (this.passing) return;
    if (this.mode === 'lan') {
      const r = this.roomHost ? this.room.localMove(from, to) : this.room.localMove(from, to);
      if (r.illegal) toast('不符合规则的走法');
      if (r.pending) toast('暗子揭示中…', 700);
      return;
    }
    this._doLocal(from, to);
  }
  _doLocal(from, to, opts = {}) {
    const m = applyMove(this.state, from, to, opts);
    this._afterMoveSfx(m);
    this._settleLocalClock(this.state.turn === 'r' ? 'b' : 'r'); // 刚走完的一方
    this._render();
    if (this.state.status !== 'playing') { this.finish(this.state.status, this.state.reason); return; }
    this._ruleNotice();
    if (this.mode === 'puzzle' && this.cfg.puzzle.type === 'draw' &&
      this.state.moves.length >= (this.cfg.puzzle.drawMoves || 80)) {
      this.finish(null, 'puzzle-draw-ok'); return;
    }
    if (this.mode === 'ai' && this.state.turn !== this.mySide) this._scheduleAi();
    if (this.mode === 'puzzle' && this.state.turn !== this.mySide) this._schedulePuzzleAi();
    if (this.mode === 'local' && this.state.status === 'playing') this._passHandset();
  }
  // 同台对坐: 全屏交接遮罩(不透明防偷看), 内容按行棋方朝向旋转(黑方在手机上侧)
  _passHandset() {
    if (this.ended || this.state.status !== 'playing') return;
    const side = this.state.turn;
    this.passing = true;
    this.board.setInteractive(false);
    this._updateSideActions(); // 交接遮罩期间两组工具都锁定, 露出遮罩防误触
    const go = () => {
      this._hidePassMask();
      this.board.clearMoveLock && this.board.clearMoveLock(); // 交接完成, 放行新行棋方的首步
      this.board.setInteractive(true);
      this.passing = false;
      this._render();
    };
    if (!this.cfg.passConfirm) { toast('请' + (side === 'r' ? '红' : '黑') + '方行棋'); go(); return; }
    this._hidePassMask();
    const isR = side === 'r';
    const card = h('div', { class: 'pass-card' + (isR ? '' : ' pass-flip') }, [
      h('div', { class: 'pass-avatar ' + side }, isR ? '帅' : '将'),
      h('div', { class: 'pass-title' }, (isR ? '红方' : '黑方') + '行棋'),
      h('div', { class: 'pass-sub' }, '手机平放桌面中间, 无需转动'),
      h('div', { class: 'pass-tap' }, '点击屏幕开始走子')
    ]);
    const mask = h('div', { class: 'pass-mask pass-' + side, onclick: () => { sfx.tap(); go(); } }, card);
    this.passMask = mask;
    this.container.appendChild(mask);
  }
  _hidePassMask() {
    if (this.passMask) { this.passMask.remove(); this.passMask = null; }
  }
  // 循环走子规则边界: 同一局面第 2 次出现时预警。
  // 真人对战(局域网/同台)只提醒双方主动变招(长将方须变招, 否则三次重复判负; 否则三次重复判和);
  // 人机/残局也预告判和, 第 3 次由引擎统一终局(人机弹和棋、残局弹和棋可重摆)。
  _ruleNotice() {
    const w = this.state && this.state.repWarn;
    if (!w || this.state.status !== 'playing') return;
    const key = this.state.moves.length + ':' + (w.perpetualSide || 'draw');
    if (this._lastRepKey === key) return; // 同一循环到达预警只提示一次
    this._lastRepKey = key;
    const human = this.mode === 'lan' || this.mode === 'local';
    if (w.perpetualSide) {
      const name = w.perpetualSide === 'r' ? '红方' : '黑方';
      toast(`${name}连续将军(长将), 须立即变招, 否则第三次重复判${name}负`);
    } else {
      toast(human ? '局面正在重复, 请主动变招; 第三次重复将判和' : '局面重复, 若继续不变, 第三次重复将判和');
    }
  }
  _afterMoveSfx(m) {
    if (!soundEnabled()) return;
    if (m.reveal) setTimeout(() => sfx.flip(), 160);
    if (m.captured) sfx.capture(); else sfx.move();
    if (m.check) setTimeout(() => sfx.check(), 120);
    vibrate(m.captured ? 25 : 10);
  }
  async _scheduleAi() {
    if (this.aiBusy || this.ended) return;
    this.aiBusy = true;
    const token = ++this.aiToken;
    this._setSub('ai', 'AI 思考中…');
    this._syncInteractive(); // 立即锁定, 不必等 worker 返回
    const mv = await aiCall(serialize(this.state), this.cfg.aiLevel || 3, false, 4500, this.cfg.aiStyle || 'balance', {
      seed: this.state.seed, ply: this.state.moves.length, engine: this.cfg.aiEngine === 'pro' ? 'pro' : 'classic'
    });
    this.aiBusy = false;
    if (token !== this.aiToken || this.ended || !mv) { this._setSub('ai', ''); this._syncInteractive(); return; }
    this._setSub('ai', '');
    if (this.state.status === 'playing' && this.state.turn !== this.mySide) this._doLocal(mv.from, mv.to);
    else this._syncInteractive();
  }
  async _schedulePuzzleAi() {
    const pz = this.cfg.puzzle;
    this.aiBusy = true;
    const token = ++this.aiToken;
    this._setSub('ai', 'AI 思考中…');
    this._syncInteractive();
    // 守和演练中 AI 为攻方, 用更强等级; 杀局/例胜用 3 级
    const lv = pz.type === 'draw' ? 5 : 3;
    const mv = await aiCall(serialize(this.state), lv, false, lv === 5 ? 4500 : 3000, 'balance', {
      seed: this.state.seed, ply: this.state.moves.length
    });
    this.aiBusy = false;
    this._setSub('ai', '');
    if (token !== this.aiToken || this.ended || !mv) { this._syncInteractive(); return; }
    if (this.state.status === 'playing' && this.state.turn !== this.mySide) {
      this._doLocal(mv.from, mv.to);
      if (this.state.status !== 'playing') return;
      if (!pz.type) {
        // 杀局: 红方用手数超限判定(红方固定为人类)
        const redMoves = Math.ceil(this.state.moves.length / 2);
        if (redMoves >= pz.mate) this._puzzleFail();
      }
    }
    this._syncInteractive();
  }
  async _hint() {
    if (this.ended || this.aiBusy) return;
    if (this.mode === 'lan') { toast('联机对局不提供提示'); return; }
    if (this.mode === 'puzzle' && this.state.turn !== this.mySide) return;
    if (this.mode === 'ai' && this.state.turn !== this.mySide) return;
    toast('计算中…', 800);
    const startMoves = this.state.moves.length;
    const startTurn = this.state.turn;
    // 杀局残局(无 type 字段、带 mate): 提示走"精确强制杀"路径(离线解面/强制杀求解),
    // 保证逐手照提示能在 mate 手内成杀; 其余(人机/定式)沿用大师启发式提示。
    const pz0 = this.mode === 'puzzle' ? this.cfg.puzzle : null;
    const useExact = !!(pz0 && !pz0.type && pz0.mate);
    let mv;
    if (useExact) {
      mv = await aiCall(serialize(this.state), 5, true, 6000, 'balance', {
        puzzleHint: true, puzzleId: pz0.id, mateTarget: pz0.mate, attacker: this.mySide || 'r'
      });
    } else {
      mv = await aiCall(serialize(this.state), 5, true, 3000);
    }
    // 计算期间玩家可能已手动走子/局面已推进: 丢弃这份"过期局面"的着法,
    // 否则会用旧起点/落点强行设置选中态, 干扰随后的选子与落子(点不动/走错)。
    if (this.ended || this.state.moves.length !== startMoves ||
      this.state.turn !== startTurn || this.state.turn !== this.mySide) return;
    // 局面未变但 worker 未给出着法(无解/超时): 明确提示, 不再静默"点了没反应"。
    if (!mv) { toast('暂未算出提示，请自行思考'); return; }
    this.board.showHintsFromAI(mv.from, mv.to); sfx.tap();
  }

  // ---------------- 悔棋/求和/认输 ----------------
  _undoLocal() {
    // 悔棋会把局面恢复为行棋中, 任何待发的终局结算弹窗都应撤销(将死后立即悔棋不再误弹"你输了")
    clearTimeout(this._fxT); this._fxT = null;
    this._lastRepKey = null;
    if (this.aiBusy) { this.aiToken++; this.aiBusy = false; }
    if (this.mode === 'local') {
      const n = Math.min(1, this.state.moves.length);
      if (!n) return;
      undoMoves(this.state, n);
      this.ended = false; this.state.status = 'playing'; this.state.reason = '';
      this.passing = false;
      closeModal();
      this._hidePassMask();
      this._render();
      sfx.tap();
      // 对坐模式悔棋后重新交接给该方
      if (this.cfg.passConfirm) this._passHandset();
      else this.board.setInteractive(true);
      return;
    }
    // 撤回半回合数由 XQUndoPlan 按模式/行棋方决定(人机/残局撤一对、同台撤一着)
    const { n } = XQUndoPlan({ mode: this.mode, state: this.state, mySide: this.mySide });
    if (!n) return;
    undoMoves(this.state, n);
    this.ended = false; this.state.status = 'playing'; this.state.reason = '';
    closeModal();
    this._render();
    sfx.tap();
  }
  _reqUndo() {
    if (this.roomHost) this.room.localUndoReq(); else this.room.undoReq();
    toast('已发送悔棋请求');
  }
  _reqDraw() {
    if (this.roomHost) this.room.localDrawReq(); else this.room.drawReq();
    toast('已发送和棋请求');
  }
  _resign() {
    if (this.mode === 'local') {
      modal({
        title: '认输', body: '请选择认输方：',
        buttons: [
          { text: '红方认输（黑方胜）', cls: 'btn-ghost', onClick: () => this.finish('blackwin', 'resign') },
          { text: '黑方认输（红方胜）', cls: 'btn-ghost', onClick: () => this.finish('redwin', 'resign') },
          { text: '取消', cls: 'btn-primary' }
        ]
      });
      return;
    }
    confirmBox({
      title: '确认认输？', body: '认输后本局判负。', okText: '认输', okCls: 'btn-primary',
      onOk: () => { if (this.mode === 'lan') { if (this.roomHost) this.room.localResign(); else this.room.resign(); } else this.finish(this.mySide === 'r' ? 'blackwin' : 'redwin', 'resign'); }
    });
  }
  _puzzleFail() {
    this.finish(null, 'puzzle-fail');
  }
  _flipView() {
    this.board.setViewSide(this.board.viewSide === 'r' ? 'b' : 'r');
  }

  // ---------------- 棋谱 / 聊天 ----------------
  _openMoves() {
    const body = h('div', { class: 'moves-grid' });
    const mv = this.state.moves;
    if (!mv.length) body.appendChild(h('div', { class: 'muted' }, '尚无着法'));
    for (let i = 0; i < mv.length; i += 2) {
      body.appendChild(h('div', { class: 'move-chip' + (i >= mv.length - 2 ? ' last' : '') }, [
        h('b', {}, String(i / 2 + 1) + '.'), mv[i].notation,
        mv[i + 1] ? ' ' + mv[i + 1].notation : ''
      ]));
    }
    // 导出: 复制/分享标准中文棋谱纯文本(离线, 仅本机/系统分享, 无外链)
    if (mv.length) {
      const modeName = this.mode === 'ai' ? '人机对弈' : this.mode === 'local' ? '同台对弈'
        : this.mode === 'lan' ? '局域网对战' : this.mode === 'puzzle' ? '残局定式' : '自由练习';
      const resultTxt = this.state.status === 'draw' ? '和棋'
        : this.state.status === 'redwin' ? '红胜' : this.state.status === 'blackwin' ? '黑胜' : '进行中';
      const text = XQExportText({
        moves: mv, result: resultTxt, reason: this.state.reason, mode: modeName,
        jieqi: !!this.cfg.jieqi, fen: this.state.initialFen, seed: this.state.seed, at: this._t0
      });
      const expBar = h('div', { class: 'xq-export-bar' }, [
        h('button', { class: 'act xq-export-btn', onclick: async () => {
          const ok = await XQCopyText(text); toast(ok ? '棋谱已复制到剪贴板' : '复制失败');
        } }, [h('div', { class: 'act-ic' }, '拷'), h('span', {}, '复制棋谱')]),
        h('button', { class: 'act xq-export-btn', onclick: async () => {
          const shared = await XQShareText(text);
          if (!shared) { const c = await XQCopyText(text); toast(c ? '已复制棋谱(本机不支持系统分享)' : '分享/复制失败'); }
        } }, [h('div', { class: 'act-ic' }, '享'), h('span', {}, '分享棋谱')])
      ]);
      body.appendChild(expBar);
    }
    sheet({ title: '棋谱' + (this.state.reason ? '（' + (REASON_TEXT[this.state.reason] || this.state.reason) + '）' : ''), bodyEl: body });
  }
  _openChat() {
    const body = h('div', {}, [h('div', { class: 'chat-body', id: 'chat-list' })]);
    const render = () => {
      const list = body.querySelector('#chat-list');
      list.innerHTML = '';
      if (!this.chatList.length) list.appendChild(h('div', { class: 'muted', style: 'text-align:center;padding:18px' }, '暂无消息，观战时也可以聊天'));
      for (const c of this.chatList) {
        const me = c.role === this.mySide || c.name === this.cfg.myName;
        list.appendChild(h('div', { class: 'bubble ' + (me ? 'me' : 'them') }, [
          me ? null : h('div', { class: 'b-name' }, c.name + (c.role === 'spec' ? ' · 观战' : '')),
          h('div', {}, c.text)
        ]));
      }
      list.scrollTop = list.scrollHeight;
    };
    this._renderChat = render; render();
    const input = h('input', { class: 'input', placeholder: '说点什么…', maxlength: 80 });
    const send = () => {
      const t = input.value.trim(); if (!t) return;
      this.room.sendChat(t);
      this._pushChat({ name: this.cfg.myName || '我', role: this.mySide, text: t, ts: Date.now() });
      input.value = '';
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    body.appendChild(h('div', { class: 'chat-input' }, [input, h('button', { class: 'btn btn-primary', onclick: send }, '发送')]));
    sheet({ title: '对局聊天', bodyEl: body });
  }
  _pushChat(c) {
    this.chatList.push(c);
    if (this._renderChat) this._renderChat();
  }

  // ---------------- 联机房间绑定 ----------------
  attachLan(room, isHost, oppName) {
    this.room = room; this.roomHost = isHost; this.opts.oppName = oppName;
    if (isHost) this.mySide = 'r';
    else if (room.seat) this.mySide = room.seat;
    room.onEvent(ev => this._onRoomEvent(ev));
    // 联机时钟: host 权威 tick; guest 本地平滑倒计时
    this._lanTimer = setInterval(() => {
      if (this.ended || !this.state) return;
      if (isHost && room.tick) room.tick(Date.now());
      this._syncLanClock();
      if (this._renderClock) this._renderClock();
      document.getElementById('bar-bottom')?.classList.toggle('active', this.state.status === 'playing' && this.state.turn === this.mySide);
      document.getElementById('bar-top')?.classList.toggle('active', this.state.status === 'playing' && this.state.turn !== this.mySide);
    }, 300);
    this.timers.push(this._lanTimer);
    // 断线重连状态机: guest 侧重连(传输断->重连中, host 主动离开->结束); host 侧沿用 peerOffline/peerBack
    this._recon = new XQNetReconnector({});
    this._recon.onTransition = (st, info) => {
      if (st === XQNetLinkState.RECONNECTING) {
        this.banner.style.display = '';
        this.banner.textContent = '连接中断, 正在尝试重连…';
      } else if (st === XQNetLinkState.UP && info.recovered) {
        this.banner.style.display = 'none'; toast('已重新连接, 棋局已同步');
      } else if (st === XQNetLinkState.GONE) {
        this.banner.style.display = 'none';
      } else if (st === XQNetLinkState.GIVEUP) {
        modal({ title: '重连失败', body: '网络中断未能恢复, 请回到建房页重新扫码加入。',
          buttons: [{ text: '返回大厅', cls: 'btn-primary', onClick: () => this.opts.onExit && this.opts.onExit() }] });
      }
    };
    this._recon.onAttemptRestart = () => {
      // 纯静态无信令服务器: 同设备可经 BroadcastChannel 中继新 SDP, 跨设备需重新扫码(由 pair.js 承担)
      if (!isHost) toast('正在恢复连接, 若长时间未恢复请重新扫码加入');
    };
  }
  _onRoomEvent(ev) {
    switch (ev.type) {
      case 'startGame':
        this.state = this.room.state; this.board.setState(this.state); this._render(); break;
      case 'snapshot':
        this.state = this.room.state; this.board.setState(this.state); this._syncLanClock(); this._render();
        this._ruleNotice(); break;
      case 'move': {
        this.state = this.room.state;
        const m = ev.move;
        this._afterMoveSfx(m);
        this.board.setLastMove(m);
        this.board.setState(this.state);
        this._syncLanClock();
        this._render();
        this._ruleNotice();
        break;
      }
      case 'undo':
        this.state = this.room.state; this.board.setState(this.state); this._render(); toast('已悔棋'); break;
      case 'undoPending':
        confirmBox({
          title: '悔棋请求', body: (ev.name || '对手') + ' 请求悔棋, 是否同意？',
          okText: '同意', cancelText: '拒绝',
          onOk: () => { if (this.roomHost) this.room.replyUndo(true); else this.room.replyUndo(true); },
          onCancel: () => { if (this.roomHost) this.room.replyUndo(false); else this.room.replyUndo(false); }
        });
        break;
      case 'undoReply': toast(ev.agree ? '对方同意悔棋' : '对方拒绝了悔棋'); break;
      case 'undoDeclined': toast('对方拒绝了悔棋'); break;
      case 'drawPending':
        confirmBox({
          title: '和棋请求', body: (ev.name || '对手') + ' 请求和棋, 是否同意？',
          okText: '同意和棋', cancelText: '拒绝',
          onOk: () => { if (this.roomHost) this.room.replyDraw(true); else this.room.replyDraw(true); },
          onCancel: () => { if (this.roomHost) this.room.replyDraw(false); else this.room.replyDraw(false); }
        });
        break;
      case 'drawReply': toast(ev.agree ? '对方同意和棋' : '对方拒绝了和棋'); break;
      case 'drawDeclined': toast('对方拒绝和棋'); break;
      case 'end':
        this._lanFinalReveal(ev);
        this.finish(ev.status, ev.reason, ev);
        break;
      case 'revealAll':
        // host 收到 guest 公开的红方排列
        this.oppPerm = ev; break;
      case 'chat': this._pushChat(ev); break;
      case 'peerOffline':
        this.banner.style.display = '';
        this.banner.textContent = ev.name + ' 断线, 90 秒内重扫房间二维码可回到对局';
        toast(ev.name + ' 断线'); break;
      case 'peerBack':
        this.banner.style.display = 'none'; toast(ev.name + ' 已重新连接'); break;
      case 'specIn': toast(ev.name + ' 进入观战'); break;
      case 'closed':
        modal({ title: '房间已解散', body: '房主离开了对局。', buttons: [{ text: '返回大厅', cls: 'btn-primary', onClick: () => this.opts.onExit && this.opts.onExit() }] });
        break;
      case 'reconnected':
        // guest 重连握手成功; 紧随其后的 snapshot 由上方 case 渲染恢复局面
        this._recon && this._recon.notifyUp(); break;
      case 'peerDropped':
        // guest 传输突兀关闭(网络中断) -> 进入重连; host 主动离开会另发 peerLeft
        if (this._recon) this._recon.notifyClosed({ clean: false });
        else { this.banner.style.display = ''; this.banner.textContent = '连接中断, 正在尝试重连…'; }
        break;
      case 'peerLeft': {
        // 收到对方主动 bye(guest 视角为房主离开): 不再重连, 直接结束
        this._recon && this._recon.notifyClosed({ clean: true });
        this.banner.style.display = 'none';
        modal({ title: this.roomHost ? '对方已离开' : '房主已离开', body: '对局已结束。',
          buttons: [{ text: '返回大厅', cls: 'btn-primary', onClick: () => this.opts.onExit && this.opts.onExit() }] });
        break;
      }
      case 'illegalMove': toast('走法被房主拒绝'); break;
    }
  }
  _lanFinalReveal(ev) {
    // 终局揭示全部暗子(结算展示)
    if (!this.cfg.jieqi) return;
    try {
      if (!this.roomHost && ev.revealHost && ev.hostValid && this.room.permOpp) {
        const perms = { r: this.room.mySide === 'b' ? this.room.permOpp : ev.revealHost.perm, b: ev.revealHost.perm };
        const all = createState({ jieqi: true, perms });
        for (const m of this.state.moves) applyMove(all, m.from, m.to, { revealT: m.reveal ? m.reveal.t : null });
        all.status = this.state.status; all.reason = this.state.reason;
        this.state = all; this.board.setState(all);
      } else if (this.roomHost && this.room.permB) {
        // host 稍等 guest 的 revealAll 消息(事件异步), 0.6s 后尽力重建; 存句柄以便退出时取消
        clearTimeout(this._revealT);
        this._revealT = setTimeout(() => {
          this._revealT = null;
          if (this._destroyed || !this.room) return;
          const permR = this.oppPerm && this.oppPerm.perm;
          const perms = { r: permR || this.room.state.initialPerms.r, b: this.room.permB };
          try {
            const all = createState({ jieqi: true, perms });
            for (const m of this.state.moves) applyMove(all, m.from, m.to, { revealT: m.reveal ? m.reveal.t : null });
            this.board.setState(all);
          } catch (e) { }
        }, 700);
      }
    } catch (e) { }
  }

  // ---------------- 时钟 ----------------
  _startClock() {
    const rule = TIME_RULES[this.cfg.time];
    if (!rule || !rule.base) { this._clk = null; return; }
    // 时钟逻辑委托 XQMakeClock(纯逻辑, 时间源默认 Date.now, 可注入假时钟自测)
    this._clk = XQMakeClock(rule);
    this._clockTimer = setInterval(() => {
      if (this.ended || this.mode === 'lan') return;
      const loser = this._clk.tick(this.state.turn);
      if (loser) { this.finish(loser === 'r' ? 'blackwin' : 'redwin', 'timeout'); return; }
      this._renderClock();
    }, 300);
    this.timers.push(this._clockTimer);
  }
  _settleLocalClock(side) {
    if (this._clk) this._clk.settle(side);
  }
  _syncLanClock() { this._clockSync = Date.now(); }
  _currentClockView() {
    if (this.mode === 'lan') {
      if (!this.room.clock) return null;
      if (this.roomHost) return this.room.clockView();
      const view = JSON.parse(JSON.stringify(this.room.clock));
      if (this._clockSync && this.state.status === 'playing') {
        view[this.state.turn].remain -= (Date.now() - this._clockSync);
      }
      return view;
    }
    return this._clk ? this._clk.view() : null;
  }

  // ---------------- 渲染 ----------------
  _setSub(who, text) {
    const el = document.getElementById(who === 'ai' ? 'bar-top-name' : 'bar-bottom-name');
    if (el) { if (!el.dataset.base) el.dataset.base = el.textContent; el.textContent = text || el.dataset.base; }
  }
  _render() {
    if (!this.board) return;
    this.board.setState(this.state);
    if (this.state.status === 'playing') this.board.setCheck(isInCheck(this.state, this.state.turn) ? this.state.turn : null);
    // 同台双人: 底部条始终为当前视角方(随交接翻转交换); 其他模式底部为己方
    const viewSide = this.mode === 'local' ? this.board.viewSide : (this.mySide === 'spec' ? 'r' : this.mySide);
    const topSide = viewSide === 'r' ? 'b' : 'r';
    this._applyBar('bar-bottom', viewSide, this.state.turn === viewSide && !this.ended);
    this._applyBar('bar-top', topSide, this.state.turn === topSide && !this.ended);
    this._renderClock();
    // 常驻走子记录(窄屏容器 display:none, 调用本身无副作用)
    this._renderMoveList && this._renderMoveList();
    this._syncInteractive();
    this._updateSideActions();
  }
  // 同台对坐: 仅当前行棋方一侧的工具组可用, 另一侧锁定(防对手误触); 交接/终局时两组都锁
  _updateSideActions() {
    if (!this.actR || !this.actB) return;
    const turn = (this.state && this.state.status === 'playing' && !this.passing && !this.ended) ? this.state.turn : null;
    this.actR.classList.toggle('is-locked', turn !== 'r');
    this.actB.classList.toggle('is-locked', turn !== 'b');
  }
  // 统一棋盘可交互状态: 仅当轮到本地下棋方、且不在结束/交接/AI 思考时才接受点击。
  // 修复人机/残局里 AI 思考回合仍可点选甚至替 AI 走子、以及思考期误触造成的"点不动"。
  _syncInteractive() {
    if (!this.board) return;
    let on;
    if (this.ended || this.passing) on = false;
    else if (this.mySide === 'spec') on = false;
    else if (this.mode === 'local' || this.mode === 'free') on = true; // 同台双人, 交接遮罩(passing)另管
    else if (this.aiBusy) on = false;
    else on = this.state.status === 'playing' && this.state.turn === this.mySide;
    // 交互"锁定 -> 可操作"的上升沿(AI/对方走完、悔棋回到己方、交接完成):
    // 清掉上一行棋方遗留的 320ms 落子动画锁, 否则快速应招后本回合开头点击会被吞
    if (on && this._lastInteractive === false) this.board.clearMoveLock && this.board.clearMoveLock();
    this._lastInteractive = on;
    this.board.setInteractive(on);
  }
  // 常驻走子记录 + 回合/行棋方信息条(仅桌面端可见; 窄屏由 CSS 隐藏)
  _renderMoveList() {
    if (!this.moveLog) return;
    const mv = this.state.moves || [];
    if (this.turnInfo) {
      const round = Math.floor(mv.length / 2) + 1;
      const sideTxt = this.state.status === 'playing'
        ? (this.state.turn === 'r' ? '红方行棋' : '黑方行棋')
        : '对局结束';
      this.turnInfo.textContent = '第 ' + round + ' 回合 · ' + sideTxt;
    }
    this.moveLog.innerHTML = '';
    if (!mv.length) {
      this.moveLog.appendChild(h('div', { class: 'move-log-empty' }, '尚未走子'));
      return;
    }
    for (let i = 0; i < mv.length; i += 2) {
      const isLast = i + 1 >= mv.length;
      this.moveLog.appendChild(h('div', { class: 'ml-row' + (isLast ? ' last' : '') }, [
        h('span', { class: 'ml-no' }, String(i / 2 + 1)),
        h('span', { class: 'ml-mv ml-r' }, mv[i].notation || ''),
        h('span', { class: 'ml-mv' }, mv[i + 1] ? (mv[i + 1].notation || '') : '')
      ]));
    }
    // 新增着法后自动滚动到底部(最新一手可见)
    this.moveLog.scrollTop = this.moveLog.scrollHeight;
  }
  _applyBar(barId, side, active) {
    const bar = document.getElementById(barId);
    if (!bar) return;
    const av = bar.querySelector('.avatar');
    av.className = 'avatar ' + side;
    av.textContent = side === 'r' ? '帅' : '将';
    const nm = document.getElementById(barId + '-name');
    if (nm) nm.textContent = this._name(side);
    this._fillTray(barId, this.state.captured[side] || []);
    bar.classList.toggle('active', !!active);
  }
  _fillTray(barId, list) {
    const tray = document.getElementById(barId + '-tray');
    if (!tray) return;
    tray.innerHTML = '';
    const N = { K: '帅', A: '仕', B: '相', N: '马', R: '车', C: '炮', P: '兵' };
    for (const c of list) {
      const span = document.createElement('span');
      span.className = 'cp' + (c.hidden ? ' unk' : '');
      span.textContent = c.hidden ? '棋' : (N[c.t] || c.t);
      tray.appendChild(span);
    }
  }
  _renderClock() {
    const view = this._currentClockView();
    const set = (barId, side) => {
      const el = document.getElementById(barId + '-clock');
      if (!el) return;
      if (!view) { el.style.display = 'none'; return; }
      el.style.display = '';
      const c = view[side];
      el.textContent = (c.phase === 'byo' ? '读秒 ' : '') + fmtTime(c.remain);
      el.classList.toggle('low', c.remain <= 30000 && view.rule.base);
    };
    const viewSide = this.mode === 'local' ? this.board.viewSide : (this.mySide === 'spec' ? 'r' : this.mySide);
    set('bar-bottom', viewSide); set('bar-top', viewSide === 'r' ? 'b' : 'r');
  }

  // ---------------- 终局 ----------------
  finish(status, reason, ev) {
    if (this.ended && reason !== 'puzzle-fail') return;
    this.ended = true;
    this.aiToken++;
    this.passing = false;
    this._hidePassMask();
    this.board && this.board.setInteractive(false);
    // 残局/定式判定
    if (this.mode === 'puzzle') {
      const pz = this.cfg.puzzle;
      if (!pz.type) {
        // 连将杀局: 限步将死
        if (reason === 'puzzle-fail' || status === 'blackwin') return this._puzzleModal(false);
        if (status === 'redwin') {
          const redMoves = Math.ceil(this.state.moves.length / 2);
          const ok = redMoves <= pz.mate;
          if (ok) { store.setPuzzleResult(pz.id, redMoves); sfx.win(); return this._puzzleModal(true, redMoves); }
          return this._puzzleModal(false, redMoves);
        }
        // 杀局中循环反复/无吃子作和: 不算过关, 弹和棋框引导主动进攻并重摆(原为静默 return 导致卡死)
        if (status === 'draw') return this._puzzleModal('mate-draw');
        return;
      }
      if (pz.type === 'win') {
        // 例胜定式: 用户执红, 将死/困毙黑方即过关
        if (status === 'redwin') {
          const redMoves = Math.ceil(this.state.moves.length / 2);
          store.setPuzzleResult(pz.id, redMoves); sfx.win(); return this._puzzleModal(true, redMoves);
        }
        if (status === 'blackwin') return this._puzzleModal(false);
        // 重复作和等: 未分胜负, 提示继续演练
        return this._puzzleModal('undecided');
      }
      // 例和定式: 用户执黑守, 红胜=失败; 黑胜/和棋/守满手数=守和成功
      if (reason === 'puzzle-draw-ok' || status === 'blackwin' || status === 'draw') {
        store.setPuzzleResult(pz.id, Math.ceil(this.state.moves.length / 2)); sfx.win();
        return this._puzzleModal(true, Math.ceil(this.state.moves.length / 2));
      }
      if (status === 'redwin') return this._puzzleModal(false);
      return;
    }
    // 观战 AI 对战: 纯旁观, 按红/黑/和结算, 不存战绩; 先停驱动再播终局特效+弹窗
    if (this.mode === 'spectate') {
      if (this.spec) { try { this.spec.stop(); } catch (e) { } }
      const draw = status === 'draw';
      if (draw) sfx.draw(); else sfx.win();
      const seal = draw ? { cls: 'seal-draw', text: '和' }
        : (status === 'redwin' ? { cls: 'seal-win', text: '红' } : { cls: 'seal-lose', text: '黑' });
      this._fxThen(this._endGrade(status, reason), () => modal({
        seal,
        title: draw ? '和棋' : (status === 'redwin' ? '红方获胜' : '黑方获胜'),
        body: (REASON_TEXT[reason] || reason || '') + '　共 ' + Math.ceil(this.state.moves.length / 2) + ' 回合',
        buttons: [
          { text: '再来一局', cls: 'btn-primary', onClick: () => this.opts.onRestart && this.opts.onRestart() },
          { text: '换个配置', cls: 'btn-ghost', onClick: () => this.opts.onExit && this.opts.onExit() },
          { text: '查看棋谱', cls: 'btn-ghost', onClick: () => this._openMoves() }
        ]
      }));
      return;
    }
    // 同台双人: 无"我方"概念, 按红/黑方结算并存战绩
    if (this.mode === 'local') return this._localFinish(status, reason);
    const draw = status === 'draw';
    const iWin = !draw && ((status === 'redwin' && this.mySide === 'r') || (status === 'blackwin' && this.mySide === 'b'));
    if (this.mySide !== 'spec') {
      if (draw) sfx.draw(); else iWin ? sfx.win() : sfx.lose();
    }
    // 存战绩(是否入库/记录组装在 XQRecords; 未走子/观战/自由练习不入库)
    if (XQShouldRecord({ mode: this.mode, mySide: this.mySide, plies: this.state.moves.length })) {
      XQSaveRecord(XQBuildRecord({
        mode: this.mode === 'ai' ? '人机对弈' : '局域网对战',
        result: draw ? '和棋' : (iWin ? '胜' : '负'),
        reason, state: this.state, cfg: this.cfg, mySide: this.mySide,
        durationMs: Date.now() - (this._t0 || Date.now())
      }));
    }
    const seal = draw ? { cls: 'seal-draw', text: '和' } : { cls: iWin ? 'seal-win' : 'seal-lose', text: draw ? '和' : (iWin ? '胜' : '负') };
    const isLan = this.mode === 'lan';
    // 先播放棋盘终局特效, 再延迟弹出结果层; 战绩/音效已同步执行不受影响
    this._fxThen(this._endGrade(status, reason), () => modal({
      seal,
      title: draw ? '和棋' : (iWin ? '你赢了' : (this.mySide === 'spec' ? '对局结束' : '你输了')),
      body: REASON_TEXT[reason] || reason || '',
      buttons: [
        this.mode === 'ai' ? { text: '再来一局', cls: 'btn-primary', onClick: () => this.opts.onRestart && this.opts.onRestart() } : null,
        isLan ? { text: '棋谱复盘', cls: 'btn-ghost', onClick: () => this._openMoves() } : { text: '查看棋谱', cls: 'btn-ghost', onClick: () => this._openMoves() },
        isLan ? { text: '返回大厅(重新建房)', cls: 'btn-ghost', onClick: () => this.opts.onExit && this.opts.onExit() }
          : { text: '返回大厅', cls: 'btn-ghost', onClick: () => this.opts.onExit && this.opts.onExit() }
      ].filter(Boolean)
    }));
  }
  _localFinish(status, reason) {
    this.ended = true;
    this.aiToken++;
    this.passing = false;
    const draw = status === 'draw';
    if (draw) sfx.draw(); else sfx.win();
    // 同台双人: 未走任何棋即结束不存战绩(终局特效/弹窗仍照常)
    if (XQShouldRecord({ mode: 'local', mySide: 'r', plies: this.state.moves.length })) {
      XQSaveRecord(XQBuildRecord({
        mode: '同台对弈',
        result: draw ? '和棋' : (status === 'redwin' ? '红胜' : '黑胜'),
        reason, state: this.state, cfg: this.cfg, mySide: null,
        durationMs: Date.now() - (this._t0 || Date.now())
      }));
    }
    const seal = draw ? { cls: 'seal-draw', text: '和' }
      : (status === 'redwin' ? { cls: 'seal-win', text: '红' } : { cls: 'seal-lose', text: '黑' });
    this._fxThen(this._endGrade(status, reason), () => modal({
      seal,
      title: draw ? '和棋' : (status === 'redwin' ? '红方获胜' : '黑方获胜'),
      body: REASON_TEXT[reason] || reason || '',
      buttons: [
        { text: '再来一局', cls: 'btn-primary', onClick: () => this.opts.onRestart && this.opts.onRestart() },
        { text: '查看棋谱', cls: 'btn-ghost', onClick: () => this._openMoves() },
        { text: '返回大厅', cls: 'btn-ghost', onClick: () => this.opts.onExit && this.opts.onExit() }
      ]
    }));
  }
  _puzzleModal(win, redMoves) {
    const pz = this.cfg.puzzle;
    if (win === 'undecided' || win === 'mate-draw') {
      const isMate = win === 'mate-draw';
      this._fxThen('draw', () => modal({
        seal: { cls: 'seal-draw', text: '和' },
        title: isMate ? '循环作和, 尚未成杀' : '尚未分出胜负',
        body: isMate
          ? '双方来回重复走子被判和棋，杀局需要你主动运子、连续进攻成杀。可重摆再试，或参考「提示」走精确杀着。'
          : '双方重复走子作和，例胜定式需要你主动运子破防。可重摆继续演练。',
        buttons: [
          { text: '重摆演练', cls: 'btn-primary', onClick: () => this.opts.onRestart && this.opts.onRestart() },
          { text: '返回列表', cls: 'btn-ghost', onClick: () => this.opts.onExit && this.opts.onExit() }
        ]
      }));
      return;
    }
    let title, body;
    if (!pz.type) {
      title = win ? '恭喜过关' : '未在 ' + pz.mate + ' 步内将死';
      body = win ? `用 ${redMoves} 步完成「${pz.name}」(目标 ${pz.mate} 步)` : '黑方已能化解, 再想想关键的第一手。';
    } else if (pz.type === 'win') {
      title = win ? '定式演练成功' : '进攻失败';
      body = win ? `以 ${redMoves} 个回合完成「${pz.name}」，例胜定式已掌握。` : '黑方化解了攻势，参考提示再试一次。';
    } else {
      title = win ? '守和成功' : '防线被突破';
      body = win ? `坚守 ${redMoves} 个回合未负，「${pz.name}」守和要领已掌握。` : '红方找到了突破口，按提示保持联防正位再守一次。';
    }
    this._fxThen(win ? 'mate' : 'light', () => modal({
      seal: win ? { cls: 'seal-win', text: '过' } : { cls: 'seal-lose', text: '憾' },
      title, body,
      buttons: [
        win ? { text: '下一关', cls: 'btn-primary', onClick: () => this.opts.onNextPuzzle && this.opts.onNextPuzzle() } : null,
        { text: win ? '重玩本关' : '重新尝试', cls: win ? 'btn-ghost' : 'btn-primary', onClick: () => this.opts.onRestart && this.opts.onRestart() },
        { text: '返回列表', cls: 'btn-ghost', onClick: () => this.opts.onExit && this.opts.onExit() }
      ].filter(Boolean)
    }));
  }

  // 终局特效分级: 将死=庆祝爆发, 困毙/和棋=中性, 认输/超时/长将=克制收尾
  _endGrade(status, reason) {
    if (status === 'draw') return 'draw';
    if (!status) return 'light';
    if (reason === 'checkmate') return 'mate';
    if (reason === 'stalemate') return 'stalemate';
    return 'light';
  }
  // 先触发棋盘特效, 特效时长后再执行原弹窗; 不支持/减弱动效时立即执行
  _fxThen(grade, fn) {
    let d = 0;
    try { if (this.board && this.board.playEnd) d = this.board.playEnd(grade) || 0; } catch (e) { d = 0; }
    if (!d) { fn(); return; }
    // 保存句柄: 特效窗口期内若悔棋(ended 复位)或退出会话(_destroyed), 到点不再弹无关结算框
    clearTimeout(this._fxT);
    this._fxT = setTimeout(() => {
      this._fxT = null;
      if (this._destroyed || !this.ended) return;
      fn();
    }, d);
  }

  // ---------------- 观战 AI 对战(纯旁观, 红黑 AI 自动对弈) ----------------
  _startSpectate() {
    if (this.spec) this.spec.stop();
    const spec = this.cfg.spec || { red: { engine: 'classic', level: 3 }, black: { engine: 'pro', level: 3 }, speed: 'mid' };
    this.spec = new XQSpectate({
      red: spec.red, black: spec.black, speed: spec.speed || 'mid',
      // aiCall 已含超时兜底(到点必回 null), 这里按当前回合方的引擎/档位发请求
      aiCallFn: (side, engine, level) => aiCall(
        serialize(this.state), level, false, 2500, 'balance',
        { engine, seed: this.state.seed, ply: this.state.moves.length }),
      fallbackFn: (side) => this._firstLegal(side),
      applyFn: (mv) => this._specApply(mv),
      onEnd: ({ status, reason }) => { if (!this.ended) this.finish(status, reason); }
    });
    this.spec.start();
  }
  // 落子+记谱+渲染+音效; 返回终局状态供驱动换方/收尾
  _specApply(mv) {
    const m = applyMove(this.state, mv.from, mv.to, {});
    this._afterMoveSfx(m);
    this._render();
    const over = this.state.status !== 'playing';
    return { over, status: this.state.status, reason: this.state.reason, nextSide: this.state.turn };
  }
  // 某方 worker 回 null 时的兜底: 取当前方首个合法着, 绝不卡死
  _firstLegal(side) {
    try { const lm = legalMoves(this.state, side); return lm && lm.length ? { from: lm[0].from, to: lm[0].to } : null; }
    catch (e) { return null; }
  }
  // 残局 AI 演示/双 AI 对弈: 启动自动演示驱动(从残局 FEN, 攻击方求解或引擎, 防守方大师)
  _startPuzDemo() {
    if (this.pzDemo) this.pzDemo.stop();
    const pz = this.cfg.puzzle;
    const attacker = this.state.turn === 'b' ? 'b' : 'r'; // 残局先手方即攻击方
    const doubleCfg = this.cfg.doubleCfg || { red: { engine: 'classic', level: 3 }, black: { engine: 'pro', level: 3 } };
    this.pzDemo = new XQPuzDemo({
      attacker,
      mode: this.pzMode,                                   // 'demo' | 'double'
      speed: this.cfg.speed || 'mid',
      // 攻击方确定性求解: worker puzzleHint(sol-maps/findForcedMate 最短杀), noBook 确定性
      solverAiCall: () => aiCall(
        serialize(this.state), 5, true, 6000, 'balance',
        { puzzleHint: true, puzzleId: pz.id, mateTarget: pz.mate || 6, attacker }),
      // 普通引擎落子(防守方大师档 / double 双方自选)
      engineAiCall: (side, engine, level) => aiCall(
        serialize(this.state), level, false, 2500, 'balance',
        { engine, seed: this.state.seed, ply: this.state.moves.length }),
      doubleCfg,
      defenderLevel: 5,
      fallbackFn: (side) => this._firstLegal(side),
      applyFn: (mv) => this._puzApply(mv),
      onEnd: ({ status, reason, plies }) => {
        if (this.ended) return;
        const v = XQPDVerdict({
          mode: this.pzMode, type: pz.type, attacker,
          mateTarget: pz.mate, status, reason, plies
        });
        this._finishPuzDemo(status, reason, v);
      }
    });
    this.pzDemo.start();
    this._specMarkSpeed();
  }
  // 演示落子: 复用观战落子渲染/音效; 返回终局状态
  _puzApply(mv) {
    const m = applyMove(this.state, mv.from, mv.to, {});
    this._afterMoveSfx(m);
    this._render();
    const over = this.state.status !== 'playing';
    return { over, status: this.state.status, reason: this.state.reason, nextSide: this.state.turn };
  }
  // 演示终局弹窗: 如实判定(成功步数/失败/和), 复用观战终局特效
  _finishPuzDemo(status, reason, v) {
    this.ended = true;
    this.aiToken++;
    const draw = status === 'draw';
    if (draw) sfx.draw(); else sfx.win();
    const seal = draw ? { cls: 'seal-draw', text: '和' }
      : (status === 'redwin' ? { cls: 'seal-win', text: '红' } : { cls: 'seal-lose', text: '黑' });
    this._fxThen(this._endGrade(status, reason), () => modal({
      seal, title: v.title, body: v.sub + '　(' + (REASON_TEXT[reason] || reason || '') + ')',
      buttons: [
        { text: '再演一次', cls: 'btn-primary', onClick: () => this.opts.onRestart && this.opts.onRestart() },
        { text: '换个配置', cls: 'btn-ghost', onClick: () => this.opts.onExit && this.opts.onExit() },
        { text: '查看棋谱', cls: 'btn-ghost', onClick: () => this._openMoves() }
      ]
    }));
  }
  _specTogglePause() {
    const drv = this.pzDemo || this.spec;
    if (!drv || this.ended) return;
    const p = !drv.paused;
    drv.setPaused(p);
    if (this.specPauseBtn) this.specPauseBtn.textContent = p ? '继续' : '暂停';
  }
  _specStep() { const drv = this.pzDemo || this.spec; drv && drv.stepOnce(); }
  _specSpeed(k) {
    const drv = this.pzDemo || this.spec;
    if (!drv) return;
    drv.setSpeed(k); this._specMarkSpeed();
  }
  _specMarkSpeed() {
    if (!this.specSpeedBtns) return;
    const drv = this.pzDemo || this.spec;
    const cur = drv ? drv.speed : 'mid';
    for (const k in this.specSpeedBtns) this.specSpeedBtns[k].classList.toggle('on', k === cur);
  }

  destroy() {
    this._destroyed = true;
    if (this.spec) { try { this.spec.stop(); } catch (e) { } this.spec = null; }
    if (this.pzDemo) { try { this.pzDemo.stop(); } catch (e) { } this.pzDemo = null; }
    clearInterval(this._clockTimer);
    clearInterval(this._lanTimer);
    clearTimeout(this._fxT);
    clearTimeout(this._revealT);
    // 兜底: 清空所有登记过的 interval/timeout, 防止重启/退出路径漏清导致空转累积
    (this.timers || []).forEach(t => { clearInterval(t); clearTimeout(t); });
    this.timers = [];
    this.aiToken++;
    // 联机房间: 摘除事件回调并置 dead, 使本端主动 close 后的异步 onClose 不再弹"房间已解散"
    if (this.room && typeof this.room.destroy === 'function') { try { this.room.destroy(); } catch (e) { } }
    this._hidePassMask();
    if (this.board) this.board.destroy();
    if (this.container) this.container.innerHTML = '';
  }
}

/* ===== js/net-peer.js ===== */
// ============================================================
// WebRTC 局域网直连(iceServers: [] —— 只产生 host/mDNS candidate,
// 不连接任何 STUN/TURN 服务器, 信令与对局数据均不经过互联网)
// ============================================================
const RTC_CONFIG = { iceServers: [] };

function dcTransport(pc, dc, id, name) {
  let openResolve;
  const t = {
    id, name, open: false,
    ready: new Promise(res => { openResolve = res; }),
    onMessage: null, onClose: null,
    send(obj) { if (dc.readyState === 'open') dc.send(JSON.stringify(obj)); },
    close() { try { dc.close(); pc.close(); } catch (e) { } }
  };
  dc.onopen = () => { t.open = true; openResolve && openResolve(true); };
  dc.onmessage = (ev) => {
    try { t.onMessage && t.onMessage(JSON.parse(ev.data)); } catch (e) { }
  };
  dc.onclose = () => t.onClose && t.onClose();
  pc.onconnectionstatechange = () => {
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) {
      openResolve && openResolve(false);
      t.onClose && t.onClose();
    }
  };
  return t;
}

// 延迟绑定版 transport(answerer/guest 专用):
// DataChannel 由房主端 createDataChannel 创建, 须等 answer 回传、ICE/DTLS/SCTP
// 建链后才经 ondatachannel 到达。为避免死锁, acceptOffer 在 gathering 完成后
// 立即返回 answer, 这里先返回一个占位 transport, 稍后由 _bind(channel) 挂上真实 dc。
// open 之前 send() 的消息入队, dc open 后按序补发(GuestRoom 构造时即发 hello)。
function dcTransportDeferred(pc, id, name) {
  let openResolve;
  const queue = [];
  let dc = null;
  const t = {
    id, name, open: false,
    ready: new Promise(res => { openResolve = res; }),
    onMessage: null, onClose: null,
    send(obj) {
      const str = JSON.stringify(obj);
      if (dc && dc.readyState === 'open') {
        try { dc.send(str); } catch (e) { queue.push(str); }
      } else {
        queue.push(str);
      }
    },
    close() { try { dc && dc.close(); pc.close(); } catch (e) { } },
    _bind(channel) {
      dc = channel;
      dc.onmessage = (ev) => {
        try { t.onMessage && t.onMessage(JSON.parse(ev.data)); } catch (e) { }
      };
      dc.onclose = () => t.onClose && t.onClose();
      dc.onopen = () => {
        t.open = true;
        openResolve && openResolve(true);
        flushQueue();
      };
      // ondatachannel 触发时常 dc 已 open, 此时再挂 onopen 不会再收到事件, 主动补一次
      if (dc.readyState === 'open') {
        t.open = true;
        openResolve && openResolve(true);
        flushQueue();
      }
    }
  };
  function flushQueue() {
    while (queue.length) {
      try { dc.send(queue.shift()); } catch (e) { break; }
    }
  }
  pc.onconnectionstatechange = () => {
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) {
      openResolve && openResolve(false);
      t.onClose && t.onClose();
    }
  };
  return t;
}

// ---------- 房主端 ----------
class HostSignaler {
  constructor({ name, cfg }) {
    this.name = name; this.cfg = cfg;
    this.slots = new Map();
    this._slot = 0;
  }
  // 创建一个邀请槽, 返回 {slot, offer} (offer 为信号对象, 由 UI 编码成二维码)
  async createSlot() {
    const slot = 's' + (++this._slot);
    const pc = new RTCPeerConnection(RTC_CONFIG);
    const dc = pc.createDataChannel('xiangqi', { ordered: true });
    const transport = dcTransport(pc, dc, slot, this.name);
    const entry = { pc, dc, transport };
    this.slots.set(slot, entry);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitGathering(pc);
    return {
      slot, transport,
      offer: { v: 1, kind: 'xq-offer', slot, name: this.name, cfg: this.cfg, sdp: pc.localDescription }
    };
  }
  // 扫到/粘贴加入者的 answer
  async feedAnswer(answer) {
    const entry = this.slots.get(answer.slot);
    if (!entry) throw new Error('没有对应的邀请槽');
    await entry.pc.setRemoteDescription(new RTCSessionDescription(answer.sdp));
    return entry.transport;
  }
  closeAll() { for (const [, e] of this.slots) { try { e.pc.close(); } catch (err) { } } this.slots.clear(); }
}

// ---------- 加入者端 ----------
class GuestSignaler {
  constructor({ name, want = 'play' }) {
    this.name = name; this.want = want;
  }
  // 扫到/粘贴房主 offer 后, 建立连接并生成 answer 信号
  async acceptOffer(offer) {
    this.offer = offer;
    const pc = new RTCPeerConnection(RTC_CONFIG);
    // 立即登记 pc: 若在下方任一 await 期间用户离开并 close(), 也能真正关闭在途连接, 而非空操作泄漏
    this.pc = pc;
    // 延迟绑定: answer 须先回传给房主, dc 才能在 ondatachannel 中到达
    const transport = dcTransportDeferred(pc, offer.slot, this.name);
    pc.ondatachannel = (ev) => transport._bind(ev.channel);
    await pc.setRemoteDescription(new RTCSessionDescription(offer.sdp));
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await waitGathering(pc);
    const answer = { v: 1, kind: 'xq-answer', slot: offer.slot, name: this.name, want: this.want, sdp: pc.localDescription };
    return { transport, answer, hostName: offer.name, cfg: offer.cfg };
  }
  close() { try { this.pc && this.pc.close(); } catch (e) { } }
}

function waitGathering(pc, timeout = 3000) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const timer = setTimeout(() => { pc.removeEventListener('icecandidate', onIce); resolve(); }, timeout);
    const onIce = (e) => { if (e.candidate === null) { clearTimeout(timer); pc.removeEventListener('icecandidate', onIce); resolve(); } };
    pc.addEventListener('icecandidate', onIce);
  });
}

/* ===== js/net-codec.js ===== */
// ============================================================
// 局域网 P2P 信令编解码(纯函数, 浏览器/Node 通用)
// JSON -> deflateRaw -> Base45(QR alphanumeric 友好) -> 分片帧
// ============================================================

let pako = globalThis.pako;
if (!pako && typeof window === 'undefined') {
  // Node 测试环境加载本地 vendor
  const { createRequire } = await import('node:module');
  pako = createRequire(import.meta.url)('../vendor/pako.min.js');
}

// RFC 9285 Base45 字母表(恰为 QR alphanumeric 字符超集, 含空格)
const B45 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';

function base45Encode(bytes) {
  let out = '';
  for (let i = 0; i < bytes.length; i += 2) {
    if (i + 1 < bytes.length) {
      // 2 字节 -> 3 字符 (高字节在前)
      const v = bytes[i] * 256 + bytes[i + 1];
      out += B45[v % 45] + B45[Math.floor(v / 45) % 45] + B45[Math.floor(v / 2025) % 45];
    } else {
      out += B45[bytes[i] % 45] + B45[Math.floor(bytes[i] / 45) % 45];
    }
  }
  return out;
}
function base45Decode(str) {
  const bytes = [];
  let i = 0;
  while (i < str.length) {
    const c1 = B45.indexOf(str[i]);
    const c2 = i + 1 < str.length ? B45.indexOf(str[i + 1]) : -1;
    const c3 = i + 2 < str.length ? B45.indexOf(str[i + 2]) : -1;
    if (c1 < 0 || c2 < 0) throw new Error('bad b45 char');
    if (c3 >= 0) {
      const v = c1 + c2 * 45 + c3 * 2025;
      bytes.push(Math.floor(v / 256) % 256, v % 256);
      i += 3;
    } else {
      bytes.push((c1 + c2 * 45) % 256);
      i += 2;
    }
  }
  return Uint8Array.from(bytes);
}

const b36 = (n, len = 2) => n.toString(36).padStart(len, '0').toUpperCase();
const FRAME_MAGIC = 'XQ';

// 对象 -> 帧字符串数组
function encodeFrames(obj, chunkSize = 260) {
  const json = JSON.stringify(obj);
  const raw = new TextEncoder().encode(json);
  const zip = pako.deflateRaw ? pako.deflateRaw(raw, { level: 9 })
    : pako.deflate ? pako.deflate(raw, { level: 9, raw: true }) : raw;
  const b45 = base45Encode(zip);
  const total = Math.max(1, Math.ceil(b45.length / chunkSize));
  if (total > 36 * 36 - 1) throw new Error('信令过大');
  const frames = [];
  for (let i = 0; i < total; i++) {
    frames.push(FRAME_MAGIC + b36(total) + b36(i) + b45.slice(i * chunkSize, (i + 1) * chunkSize));
  }
  return frames;
}

// 帧装配器: 喂入扫描到的字符串, 集齐后回调完整 payload
class FrameReader {
  constructor() { this.reset(); }
  reset() { this.total = 0; this.parts = new Map(); this.payload = null; }
  isFrame(s) { return typeof s === 'string' && s.startsWith(FRAME_MAGIC) && s.length >= 8; }
  add(text) {
    if (!this.isFrame(text)) return null;
    const total = parseInt(text.slice(2, 4), 36);
    const idx = parseInt(text.slice(4, 6), 36);
    const data = text.slice(6);
    if (!Number.isFinite(total) || !Number.isFinite(idx) || idx >= total) return null;
    if (this.total && this.total !== total) this.reset(); // 新一轮
    this.total = total;
    this.parts.set(idx, data);
    if (this.parts.size === total) {
      let joined = '';
      for (let i = 0; i < total; i++) joined += this.parts.get(i);
      this.payload = joined;
      const full = joined;
      this.reset();
      return full;
    }
    return null;
  }
  get progress() { return this.total ? this.parts.size / this.total : 0; }
}

// 完整 payload <-> 对象
function encodeSignal(obj) {
  const frames = encodeFrames(obj);
  return frames.length === 1 ? frames[0] : frames;
}
function decodeSignal(payload) {
  const zip = base45Decode(payload);
  const raw = pako.inflateRaw ? pako.inflateRaw(zip)
    : pako.inflate ? pako.inflate(zip, { raw: true }) : zip;
  return JSON.parse(new TextDecoder().decode(raw));
}

/* ===== js/qrcode-ui.js ===== */
// ============================================================
// 二维码生成(canvas)与摄像头扫描(jsQR); 信号帧全部字符可走
// QR Alphanumeric 模式(0-9 A-Z 空格 $%*+-./:)
// ============================================================

// 在 canvas 上绘制二维码; text 须为 Alphanumeric 字符集
function renderQR(canvas, text, { fg = '#1a1a1a', bg = '#ffffff', margin = 2, scale } = {}) {
  const qr = qrcode(0, 'M'); // 自动选择最小版本, 纠错 M
  qr.addData(text, 'Alphanumeric');
  qr.make();
  const count = qr.getModuleCount();
  const size = count + margin * 2;
  const css = scale || Math.floor((canvas.parentElement?.clientWidth || 280) / size);
  canvas.width = size * css; canvas.height = size * css;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = fg;
  for (let r = 0; r < count; r++) for (let c = 0; c < count; c++) {
    if (qr.isDark(r, c)) ctx.fillRect((c + margin) * css, (r + margin) * css, css, css);
  }
  return { count, modules: size };
}

// 帧轮播播放器
class FramePlayer {
  constructor(canvas, frames, { interval = 350, fg, bg } = {}) {
    this.frames = frames; this.i = 0; this.canvas = canvas;
    this.interval = interval; this.qropts = { fg, bg };
    this.timer = null; this.onTick = null;
  }
  start() {
    const draw = () => {
      renderQR(this.canvas, this.frames[this.i], this.qropts);
      this.onTick && this.onTick(this.i + 1, this.frames.length);
      this.i = (this.i + 1) % this.frames.length;
    };
    draw();
    this.timer = setInterval(draw, this.interval);
  }
  stop() { if (this.timer) clearInterval(this.timer); this.timer = null; }
}

// 摄像头扫描器
class QrScanner {
  constructor({ onFrame, onProgress, onError } = {}) {
    this.onFrame = onFrame; this.onProgress = onProgress; this.onError = onError;
    this.running = false;
    this.stream = null;
    this._cancelled = false;
  }
  async start(videoEl, hiddenCanvas) {
    this.video = videoEl;
    this.canvas = hiddenCanvas || document.createElement('canvas');
    this._cancelled = false;
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    // 授权弹窗期间用户可能已离开(stop): 立即释放刚拿到的摄像头, 不得点灯/启动解码循环
    if (this._cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
    this.stream = stream;
    videoEl.srcObject = stream;
    await videoEl.play().catch(() => { });
    if (this._cancelled) { this.stop(); return; }
    this.running = true;
    const loop = () => {
      if (!this.running) return;
      if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
        const w = videoEl.videoWidth, h = videoEl.videoHeight;
        if (w) {
          this.canvas.width = w; this.canvas.height = h;
          const ctx = this.canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(videoEl, 0, 0, w, h);
          try {
            const img = ctx.getImageData(0, 0, w, h);
            const code = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
            if (code && code.data) this.onFrame && this.onFrame(code.data);
          } catch (e) { }
        }
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  stop() {
    this._cancelled = true;
    this.running = false;
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = null;
  }
}

/* ===== js/net-discover.js ===== */
// ============================================================
// 同设备(同浏览器)多标签/多页近场发现 —— 纯静态无服务器边界内能做到的最好
//
// 能力边界(务必与文案一致):
//  * 纯静态网页没有 mDNS / DNS-SD / UDP 广播 API, 跨设备"自动发现"在不引入
//    任何信令服务器的前提下做不到; 因此:
//      - 同设备多标签/多页: 用 BroadcastChannel(同源) 自动广播发现,
//        offer/answer 信令帧直接在标签之间中继, 免去两轮扫码。
//      - 跨设备: 仍只能靠「出二维码/房间码 + 扫码或粘贴剪贴板」手动交换 SDP。
//  * 本模块不触碰 RTCPeerConnection, 只搬运已经编好的信令帧字符串,
//    因此不改变 iceServers(恒为 [])、不引入 STUN/TURN/中继/互联网信令。
// ============================================================

const XQNET_DISCOVER_PROTO = 1;
const XQNET_DISCOVER_CHANNEL = 'xqnet-lan-v1';

// 当前环境是否具备同设备发现能力(BroadcastChannel)
function xqNetDiscoverSupported() {
  try { return typeof globalThis.BroadcastChannel === 'function'; }
  catch (e) { return false; }
}

function xqNetRandId() {
  return 't' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}

// 一条同设备发现会话。host 侧与 guest 侧共用本类, 靠 becomeHost/becomeGuest 区分角色。
// bus 可注入(测试用内存总线); 浏览器内缺省用 BroadcastChannel。
//
// 消息(均为 JSON 安全的普通对象, 经 BroadcastChannel 传递):
//   xqnet/presence  host -> 广播: 我在这个浏览器里开了房间 {hostName,cfg,roomCode}
//   xqnet/list      guest -> 广播: 请现存 host 重新播报一次
//   xqnet/offerReq  guest -> host: 把你的邀请信令帧发给我
//   xqnet/offer     host  -> guest: 邀请信令帧(与二维码编码出的 frames 完全一致)
//   xqnet/answer    guest -> host: 回答信令帧
//   xqnet/gone      host -> 广播: 我已退出
class XQNetDiscovery {
  constructor({ selfId, bus, channel } = {}) {
    this.selfId = selfId || xqNetRandId();
    this.role = null;
    this.hostInfo = null;
    this.hosts = new Map();      // hostId -> {hostId, hostName, cfg, roomCode, ts}
    // ---- 供 pair.js 挂载的钩子 ----
    this.onRoomList = null;      // (list:Array) => {}          guest 侧: 同浏览器可用房间刷新
    this.onOfferRequest = null;  // (guestId) => {}             host 侧: 某 guest 标签要我的邀请帧
    this.onOffer = null;         // ({hostId,hostName,cfg,frames}) => {}   guest 侧: 拿到邀请帧
    this.onAnswer = null;        // ({guestId, frames}) => {}   host 侧: 拿到 guest 的回答帧
    this.onGone = null;          // (hostId) => {}
    this._keepAlive = null;
    this._bus = bus || (xqNetDiscoverSupported() ? new BroadcastChannel(channel || XQNET_DISCOVER_CHANNEL) : null);
    if (this._bus) this._bus.onmessage = (ev) => this._route(ev && ev.data);
  }
  get available() { return !!this._bus; }

  _post(msg) {
    if (!this._bus) return;
    try { this._bus.postMessage(Object.assign({ proto: XQNET_DISCOVER_PROTO, from: this.selfId }, msg)); }
    catch (e) { }
  }
  _route(m) {
    if (!m || m.proto !== XQNET_DISCOVER_PROTO || m.from === this.selfId) return;
    switch (m.kind) {
      case 'xqnet/presence':
        this.hosts.set(m.from, { hostId: m.from, hostName: m.hostName, cfg: m.cfg, roomCode: m.roomCode, ts: m.ts || Date.now() });
        this.onRoomList && this.onRoomList([...this.hosts.values()]);
        break;
      case 'xqnet/list':
        this._postPresence();           // host 收到 list 请求 -> 立即重新播报
        break;
      case 'xqnet/offerReq':
        if (m.to === this.selfId) this.onOfferRequest && this.onOfferRequest(m.from);
        break;
      case 'xqnet/offer':
        if (m.to === this.selfId) this.onOffer && this.onOffer({ hostId: m.from, hostName: m.hostName, cfg: m.cfg, frames: m.frames });
        break;
      case 'xqnet/answer':
        if (m.to === this.selfId) this.onAnswer && this.onAnswer({ guestId: m.from, frames: m.frames });
        break;
      case 'xqnet/gone':
        if (this.hosts.delete(m.from)) {
          this.onRoomList && this.onRoomList([...this.hosts.values()]);
          this.onGone && this.onGone(m.from);
        }
        break;
    }
  }

  // ---------- host 侧 ----------
  becomeHost({ hostName, cfg, roomCode }) {
    this.role = 'host';
    this.hostInfo = { hostName, cfg, roomCode };
    this._postPresence();
    // 周期性心跳播报: guest 列表随 tab 存活自动刷新
    try { this._keepAlive = setInterval(() => this._postPresence(), 4000); } catch (e) { }
  }
  _postPresence() {
    if (this.role !== 'host' || !this.hostInfo) return;
    this._post({
      kind: 'xqnet/presence', role: 'host',
      hostName: this.hostInfo.hostName, cfg: this.hostInfo.cfg, roomCode: this.hostInfo.roomCode, ts: Date.now()
    });
  }
  // host 被某 guest 标签索要邀请帧后, 把当前邀请帧定向推过去
  pushOffer(guestId, { hostName, cfg, frames }) {
    this._post({ kind: 'xqnet/offer', to: guestId, hostName, cfg, frames });
  }

  // ---------- guest 侧 ----------
  becomeGuest() {
    this.role = 'guest';
    this.refreshList();
  }
  refreshList() {
    this.hosts.clear();
    this.onRoomList && this.onRoomList([]);
    this._post({ kind: 'xqnet/list' });
  }
  requestOffer(hostId) { this._post({ kind: 'xqnet/offerReq', to: hostId }); }
  deliverAnswer(hostId, frames) { this._post({ kind: 'xqnet/answer', to: hostId, frames }); }

  leave() {
    try { if (this._keepAlive) clearInterval(this._keepAlive); } catch (e) { }
    this._keepAlive = null;
    this._post({ kind: 'xqnet/gone' });
    try { this._bus && this._bus.close(); } catch (e) { }
  }
}

/* ===== js/pair.js ===== */
// ============================================================
// 局域网配对: 两轮扫码(房主 offer 轮播 -> 加入者 answer -> 房主扫回)
// 纯 WebRTC, iceServers:[]; 另提供文本信令兜底(手动传递)
// ============================================================








// 信令协议版本: 跨设备扫码交换时若对端版本不符, 明确提示而非静默卡死
const XQNET_PROTO_V = 1;
// 把一组信令帧拼成完整 payload(复用 FrameReader), 失败返回 null
function assembleFrames(reader, frames) {
  let payload = null;
  for (const f of frames) {
    if (!reader.isFrame(f)) continue;
    payload = reader.add(f) || payload;
  }
  return payload;
}

const TIME_LABEL = { none: '不限时', '5': '5分钟包干', '10': '10分钟包干', '20': '20分钟包干', '5+3': '5分+3秒', '10+3': '10分+3秒', '10+30s': '10分+30秒读秒' };

function stepHead(no, title, sub) {
  return h('div', { class: 'step-head' }, [
    h('div', { class: 'step-badge' }, String(no)),
    h('div', { style: 'flex:1;min-width:0' }, [
      h('div', { class: 'st-t' }, title),
      sub ? h('div', { class: 'st-s' }, sub) : null
    ])
  ]);
}

function frameTextFromTextarea(value) {
  return value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
}

// ================= 房主流程 =================
async function hostPairFlow(root, { name, cfg, onEnter, onBack }) {
  root.innerHTML = '';
  const signaler = new HostSignaler({ name, cfg });
  let room = null;
  let player = null, scanner = null, reader = new FrameReader();
  let connected = 0;
  let currentOfferFrames = null;   // 当前邀请帧, 供同设备标签索要时推送
  // 同设备(同浏览器)多标签发现: 若支持, 自动广播房间存在; 不支持则静默降级为纯扫码
  const disco = xqNetDiscoverSupported() ? new XQNetDiscovery() : null;
  if (disco) {
    disco.onAnswer = ({ frames }) => {
      const payload = assembleFrames(new FrameReader(), frames);
      if (payload) onAnswer(payload).catch(() => { });
    };
    disco.onOfferRequest = (guestId) => {
      if (currentOfferFrames) disco.pushOffer(guestId, { hostName: name, cfg, frames: currentOfferFrames });
    };
    disco.becomeHost({ hostName: name, cfg, roomCode: null });
  }

  root.appendChild(navBar({
    title: '创建对局房间', backLabel: '大厅',
    onBack: () => cleanup(onBack)
  }));
  const wrap = h('div', { class: 'pair-wrap', style: 'flex:1;min-height:0;overflow-y:auto' });
  root.appendChild(wrap);

  const top = stepHead(1, '请好友扫描你屏幕上的二维码',
    `房间: ${cfg.jieqi ? '揭棋' : '中国象棋'} · ${TIME_LABEL[cfg.time] || '不限时'} · 房主执红`);
  const stage = h('div', { class: 'qr-stage' }, [
    h('canvas', { id: 'host-qr' }),
    h('div', { class: 'qr-cap', id: 'host-qr-cap' }, '等待生成…'),
    h('div', { class: 'prog-bar' }, h('div', { class: 'prog-fill', id: 'host-qr-fill', style: 'width:0%' }))
  ]);
  const scanStage = h('div', { class: 'qr-stage' }, [
    stepHead(2, '好友屏幕出现二维码后, 用摄像头扫回'),
    h('div', { class: 'scan-video-wrap', style: 'aspect-ratio:16/10;margin-top:12px' }, [
      h('video', { class: 'scan-video', id: 'host-video', playsinline: '', muted: '' }),
      h('div', { class: 'scan-frame', style: 'inset:24%' }),
      h('div', { class: 'scan-hint', id: 'host-scan-hint' }, '正在启动摄像头…')
    ])
  ]);
  const inviteMore = h('button', { class: 'btn btn-ghost btn-block', style: 'display:none;margin-top:2px', onclick: () => addSlot() }, '继续邀请观战者(再扫一人)');

  // 文本信令兜底
  const textDetail = h('details', { class: 'text-code' }, [
    h('summary', {}, '无法扫码? 使用文本信令(同设备双开/手动传递)'),
    h('div', { class: 'muted', style: 'margin:6px 0' }, '把下面全部文本发给好友(任选方式); 好友生成的回答信令粘贴到这里:'),
    h('textarea', { id: 'host-offer-text', readonly: '', style: 'height:70px' }),
    h('textarea', { id: 'host-answer-text', placeholder: '在此粘贴好友的回答信令(可一次粘贴多行)' }),
    h('button', {
      class: 'btn btn-primary btn-block', style: 'margin-top:6px', onclick: async () => {
        const frames = frameTextFromTextarea(document.getElementById('host-answer-text').value);
        let payload = null;
        for (const f of frames) { payload = reader.add(f) || payload; if (f && !reader.isFrame(f)) toast('包含非信令内容, 已忽略'); }
        if (payload) await onAnswer(payload); else toast('回答信令不完整');
      }
    }, '导入回答信令')
  ]);
  wrap.append(top, stage, scanStage, inviteMore, textDetail);

  async function addSlot() {
    const { slot, transport, offer } = await signaler.createSlot();
    const frames = encodeFrames(offer);
    currentOfferFrames = frames;
    document.getElementById('host-offer-text').value = frames.join('\n');
    if (player) player.stop();
    player = new FramePlayer(document.getElementById('host-qr'), frames, { interval: 320 });
    player.onTick = (i, total) => {
      document.getElementById('host-qr-cap').textContent = `请好友扫描 (${i}/${total})`;
      document.getElementById('host-qr-fill').style.width = (i / total * 100) + '%';
    };
    player.start();
    return { slot, transport };
  }

  async function onAnswer(payload) {
    let answer;
    try { answer = decodeSignal(payload); }
    catch (e) { toast('回答信令解析失败: 二维码不完整或已损坏'); return false; }
    if (answer.kind !== 'xq-answer') { toast('不是有效的回答信令(类型不符)'); return false; }
    if (answer.v !== XQNET_PROTO_V) { toast('回答信令版本不符: 请双方更新到同一版本后重试'); return false; }
    let transport;
    try { transport = await signaler.feedAnswer(answer); }
    catch (e) { toast('接受回答失败: ' + e.message); return false; }
    const ok = await Promise.race([
      transport.ready,
      new Promise(r => setTimeout(() => r(false), 8000))
    ]);
    if (!ok) { toast('连接失败: 请确认双方在同一局域网/WiFi, 重试扫码'); return false; }
    if (!room) {
      room = new HostRoom({ name, rules: cfg });
      room.onEvent(ev => onHostEvent(ev));
    }
    transport.name = answer.name;
    room.addTransport(transport);
    connected++;
    sfx.invite();
    return true;
  }

  function onHostEvent(ev) {
    if (ev.type === 'challenge') {
      const wantText = ev.want === 'watch' ? '观战' : '对战';
      const seatFree = !room.seats.b;
      modal({
        title: '加入请求',
        body: `${ev.name} 请求加入房间(${wantText})。联机数据仅在局域网内直连传输。`,
        buttons: [
          ev.want === 'play' && seatFree ? { text: '同意对战', cls: 'btn-primary', onClick: () => room.acceptJoin(ev.peerId, 'b') } : null,
          { text: '允许观战', cls: 'btn-ghost', onClick: () => room.acceptJoin(ev.peerId, 'spec') },
          { text: '拒绝', cls: 'btn-ghost', onClick: () => room.declineJoin(ev.peerId, '房间已满') }
        ].filter(Boolean)
      });
    } else if (ev.type === 'startGame') {
      cleanup(null, true);
      const opp = room.seats.b ? room.seats.b.name : '黑方';
      onEnter(room, { isHost: true, oppName: opp });
    } else if (ev.type === 'peers') {
      const playing = ev.peers.some(p => p.role === 'b');
      if (playing) { inviteMore.style.display = ''; inviteMore.textContent = '继续邀请观战者(再扫一人)'; }
    }
  }

  // 摄像头扫 answer
  async function startScan() {
    scanner = new QrScanner({
      onFrame(text) {
        if (!reader.isFrame(text)) return;
        const payload = reader.add(text);
        if (payload) { reader = new FrameReader(); onAnswer(payload).then(ok => { if (ok === false) reader = new FrameReader(); }); }
        else {
          document.getElementById('host-scan-hint').textContent = '正在采集回答二维码…';
        }
      }
    });
    try {
      await scanner.start(document.getElementById('host-video'));
      document.getElementById('host-scan-hint').textContent = '摄像头已就绪, 对准好友屏幕';
    } catch (e) {
      document.getElementById('host-scan-hint').textContent = '摄像头不可用, 可使用下方文本信令';
    }
  }

  function cleanup(cb, keep) {
    if (player) player.stop();
    if (scanner) scanner.stop();
    if (!keep) { signaler.closeAll(); try { disco && disco.leave(); } catch (e) { } }
    if (cb) cb();
  }
  window._xqPairCleanup = () => cleanup(null);

  await addSlot();
  await startScan();
}

// ================= 加入者流程 =================
async function guestPairFlow(root, { name, want, onEnter, onBack }) {
  root.innerHTML = '';
  root.appendChild(navBar({
    title: '加入对局', backLabel: '大厅',
    onBack: () => cleanup(onBack)
  }));
  const wrap = h('div', { class: 'pair-wrap', style: 'flex:1;min-height:0;overflow-y:auto' });
  root.appendChild(wrap);
  let signaler = null, scanner = null, room = null, answered = false;
  let connectTimer = null, player = null, left = false;
  let bcHostId = null;   // 若本次邀请来自同设备标签, 应答帧经 BC 回传
  const offerReader = new FrameReader();
  // 同设备发现: 列出本浏览器其他标签页已开的房间, 点选即免扫码加入
  const disco = xqNetDiscoverSupported() ? new XQNetDiscovery() : null;

    ])),
    (() => {
      const d = h('details', { class: 'text-code' }, [
        h('summary', {}, '无法扫码? 粘贴房主的邀请信令'),

        h('button', {
          class: 'btn btn-primary btn-block', style: 'margin-top:6px', onclick: () => {

  const answerView = h('div', { style: 'display:none' }, [
    stepHead(2, '请房主扫描你屏幕上的二维码'),

      h('canvas', { id: 'guest-qr' }),

      h('div', { class: 'prog-bar' }, h('div', { class: 'prog-fill', id: 'guest-qr-fill', style: 'width:0%' }))
    ]),
    h('div', { class: 'muted', style: 'text-align:center' }, '扫描成功后将自动进入房间, 请保持屏幕常亮'),
    // 文本信令兜底: 同设备双开/无摄像头时, 把 answer 文本回传给房主
    h('details', { class: 'text-code' }, [
      h('summary', {}, '无法扫码? 复制回答信令(同设备双开/手动传递)'),
      h('div', { class: 'muted', style: 'margin:6px 0' }, '把下面全部回答信令发给房主, 让房主粘贴进其「导入回答信令」框:'),
      h('textarea', { id: 'guest-answer-text', readonly: '', style: 'height:70px' }),
      h('button', {
        class: 'btn btn-primary btn-block', style: 'margin-top:6px', onclick: async () => {
          const ta = document.getElementById('guest-answer-text');
          const txt = ta.value;
          try { await navigator.clipboard.writeText(txt); toast('已复制回答信令'); }
          catch (e) {
            ta.focus(); ta.select();
            try { if (document.execCommand('copy')) toast('已复制回答信令'); else toast('请长按手动选择全部复制'); }

        }
      }, '复制回答信令')

  ]);
  wrap.append(scanView, answerView);

  async function onOffer(payload, { fromBC = false } = {}) {
    if (answered) return;
    let offer;
    try { offer = decodeSignal(payload); } catch (e) { toast('邀请信令解析失败: 二维码不完整或已损坏'); return; }
    if (offer.kind !== 'xq-offer') { toast('不是有效的房间邀请(类型不符)'); return; }
    if (offer.v !== XQNET_PROTO_V) { toast('邀请信令版本不符: 请双方更新到同一版本后重试'); return; }
    if (!fromBC) bcHostId = null;   // 扫码/粘贴路径 -> 应答走二维码; BC 路径 -> 走标签中继
    answered = true;
    signaler = new GuestSignaler({ name, want });
    let res;
    try { res = await signaler.acceptOffer(offer); } catch (e) { toast('建立连接失败: ' + e.message); answered = false; return; }
    // await 期间用户可能已返回: 立即收尾, 不再建房/播二维码/挂超时, 避免在大厅空弹"连接超时"
    if (left) { try { signaler.close(); } catch (e2) { } return; }
    room = new GuestRoom(res.transport, { name, want });
    room.onEvent(ev => onGuestEvent(ev, offer));
    // 显示 answer QR
    scanView.style.display = 'none'; answerView.style.display = '';
    const frames = encodeFrames(res.answer);
    document.getElementById('guest-answer-text').value = frames.join('\n');
    if (bcHostId && disco) disco.deliverAnswer(bcHostId, frames);  // 同设备: 应答帧经 BC 直达房主标签
    player = new FramePlayer(document.getElementById('guest-qr'), frames, { interval: 320 });
    player.onTick = (i, total) => {
      document.getElementById('guest-qr-cap').textContent = `等待房主扫描 (${i}/${total})`;
      document.getElementById('guest-qr-fill').style.width = (i / total * 100) + '%';
    };
    player.start();
    if (scanner) scanner.stop();
    // 可撤销的连接超时看护: 放宽到 30s 以容纳人工文本信令流程(切标签/复制/房主粘贴/同意);
    // open、进房、离开任一路径都会撤销定时器; 触发时多重判定, 已连接绝不误弹遮罩
    connectTimer = setTimeout(() => {
      connectTimer = null;
      if (entered || room.state || res.transport.open) return;
      modal({
        title: '连接超时', body: '请确认双方在同一局域网/WiFi, 房主已扫描你的二维码, 或已导入你的回答信令。',
        buttons: [{ text: '重试', cls: 'btn-primary', onClick: () => cleanup(onBack) }]
      });
    }, 30000);
    res.transport.ready.then(ok => {
      // 数据通道 open 即视为连接成功, 撤销超时; ready 因 ICE 瞬时断开解析为 false 时
      // 不立刻弹失败框, 仍交 30s 定时器在触发时按 transport.open/room.state 判定, 避免瞬断误报
      if (ok && connectTimer) { clearTimeout(connectTimer); connectTimer = null; }
    });
  }
  let entered = false;
  function onGuestEvent(ev, offer) {
    if (ev.type === 'joinDeclined') {
      modal({ title: '房主拒绝了请求', body: ev.reason || '房间可能已满。', buttons: [{ text: '返回', cls: 'btn-primary', onClick: () => cleanup(onBack) }] });
    } else if (ev.type === 'snapshot' && !entered) {
      entered = true;
      if (connectTimer) { clearTimeout(connectTimer); connectTimer = null; } closeModal();
      cleanup(null, true);
      onEnter(room, { cfg: offer.cfg, hostName: offer.name, seat: ev.seat });
    }
  }

  async function startScan() {
    scanner = new QrScanner({
      onFrame(text) {
        if (!offerReader.isFrame(text)) return;
        const payload = offerReader.add(text);
        if (payload) onOffer(payload);
      }
    });
    try {
      await scanner.start(document.getElementById('guest-video'));
      document.getElementById('guest-scan-hint').textContent = '将摄像头对准房主屏幕的二维码';
    } catch (e) {
      document.getElementById('guest-scan-hint').textContent = '摄像头不可用, 请使用文本信令';
    }
  }
  function cleanup(cb, keep) {
    if (!keep) left = true; // 进局移交(keep)不算离开; 其余路径令在途 onOffer 续体中止
    if (connectTimer) { clearTimeout(connectTimer); connectTimer = null; }
    if (player) { try { player.stop(); } catch (e) { } player = null; } // 停止 answer 二维码轮播(与 host 对称)
    if (scanner) scanner.stop();
    if (!keep) {
      if (signaler) signaler.close();
      if (room && typeof room.destroy === 'function') { try { room.destroy(); } catch (e) { } }
      try { disco && disco.leave(); } catch (e) { }
    }
    if (cb) cb();
  }
  window._xqPairCleanup = () => cleanup(null);

  await startScan();
}

// ============================================================
// AI 复盘分析(主线程侧): 驱动 worker 逐手评分, 管理进度/取消/缓存
// ============================================================



const GRADE_META = {
  brilliant:   { sym: '!!', label: '妙手', cls: 'g-brilliant' },
  good:        { sym: '!',  label: '好着', cls: 'g-good' },
  best:        { sym: '✓',  label: '正着', cls: 'g-best' },
  inaccuracy:  { sym: '?!', label: '缓手', cls: 'g-inaccuracy' },
  mistake:     { sym: '?',  label: '错着', cls: 'g-mistake' },
  blunder:     { sym: '??', label: '败着', cls: 'g-blunder' }
};

// 红方视角分数 -> 人类可读(单位: 兵=100; 绝杀/劣势)
function scoreText(v) {
  if (v >= 99800) return '红绝杀';
  if (v <= -99800) return '黑绝杀';
  const n = v / 100;
  return (n > 0 ? '红优 ' : n < 0 ? '黑优 ' : '均势 ') + (Math.abs(n) < 0.15 ? '' : Math.abs(n).toFixed(1));
}

// 分析一局战绩记录; 返回 { promise, cancel }
function analyzeRecord(rec, { onProgress, deadlineMs = 1200, style = 'balance' } = {}) {
  const cached = store.getAnalysis(rec.id);
  if (cached && cached.analyzed >= rec.moves.length) {
    return { promise: Promise.resolve(cached), cancel() { } };
  }
  const w = createAiWorker();
  const reqId = Date.now() & 0x7fffffff;
  let done = false, timer = null;
  const promise = new Promise((resolve, reject) => {
    timer = setTimeout(() => { if (!done) { done = true; w.terminate(); reject(new Error('分析超时')); } },
      (rec.moves.length * deadlineMs + 60000));
    w.onmessage = (e) => {
      const d = e.data;
      if (d.reqId !== reqId) return;
      if (d.progress) { onProgress && onProgress(d.index, d.total); return; }
      if (d.done) {
        clearTimeout(timer); done = true; w.terminate();
        if (d.ok) { store.saveAnalysis(rec.id, d.report); resolve(d.report); }
        else reject(new Error(d.error || '分析失败'));
      }
    };
    w.onerror = (err) => { if (!done) { done = true; clearTimeout(timer); w.terminate(); reject(err); } };
    w.postMessage({
      reqId, analyze: true,
      initial: { jieqi: !!rec.jieqi, fen: rec.fen, seed: rec.seed },
      moves: rec.moves, deadlineMs, style
    });
  });
  return {
    promise,
    cancel() { if (!done) { done = true; clearTimeout(timer); w.terminate(); } }
  };
}

function applyUiTheme(ui) {

// 避免旧页面的 setInterval / Worker 在后台空转或在已脱离的 DOM 上写结果。
let reviewPlayTimer = null;
function clearReviewPlayTimer() {
  if (reviewPlayTimer !== null) { clearInterval(reviewPlayTimer); reviewPlayTimer = null; }
}
function setReviewPlayTimer(fn, ms) { clearReviewPlayTimer(); reviewPlayTimer = setInterval(fn, ms); }
let currentAnalysisJob = null;

  if (currentAnalysisJob) { try { currentAnalysisJob.cancel && currentAnalysisJob.cancel(); } catch (e) { } currentAnalysisJob = null; }

let reviewSeq = 0;

function disposeCurrentSession() {
  if (currentSession) { try { currentSession.destroy(); } catch (e) { } currentSession = null; }

// ---------------- 栈导航(push/pop 滑栈) ----------------
let navStack = [];
const NAV_MS = 330;
function show(id) {
  const all = document.querySelectorAll('.screen');
  const cur = navStack[navStack.length - 1];
  const toEl = document.getElementById(id);
  if (cur === id) { // 同一屏复用(如 人机/建房/加入 共用 setup), 做淡入
    toEl.classList.remove('nav-fade'); void toEl.offsetWidth;
    toEl.classList.add('nav-fade');
    setTimeout(() => toEl.classList.remove('nav-fade'), 240);
    toEl.scrollTop = 0;
    return;
  }
  const fromEl = cur && document.getElementById(cur);
  const backAt = navStack.lastIndexOf(id);
  const dir = backAt >= 0 ? 'back' : 'fwd';
  if (backAt >= 0) navStack.length = backAt + 1; else navStack.push(id);

  all.forEach(s => s.classList.remove('active', 'nav-fade', 'nav-enter-fwd', 'nav-enter-back', 'nav-leave-fwd', 'nav-leave-back'));
  toEl.classList.add('active');
  toEl.scrollTop = 0;
  if (fromEl) {
    toEl.classList.add(dir === 'fwd' ? 'nav-enter-fwd' : 'nav-enter-back');
    fromEl.classList.add('active', dir === 'fwd' ? 'nav-leave-fwd' : 'nav-leave-back');
    setTimeout(() => {
      fromEl.classList.remove('active', 'nav-leave-fwd', 'nav-leave-back');
      toEl.classList.remove('nav-enter-fwd', 'nav-enter-back');
    }, NAV_MS);
  }
}
function go(hash) {
  // 残局列表与对局共用 hash(#/puzzles): 对局内退出时 hash 未变, 需手动重路由
  if (location.hash === hash) { route(); } else { location.hash = hash; }
}

// 旧会话在转场动画结束后再销毁(避免滑出中的棋盘被提前清空)
function route() {
  document.body.dataset.theme = store.settings().theme || 'wood';
  applyUiTheme(currentUiTheme());
  const hash = location.hash || '#/home';
  const oldSession = currentSession; currentSession = null;
  const oldPairCleanup = window._xqPairCleanup; window._xqPairCleanup = null;
  closeModal(); closeSheet();
  // 离开任意页面: 停止打谱/复盘自动播放与后台 AI 分析, 使旧复盘异步回调失效
  clearReviewPlayTimer(); clearCurrentAnalysisJob(); reviewSeq++;
  if (oldSession) setTimeout(() => { try { oldSession.destroy(); } catch (e) { } }, NAV_MS + 20);
  if (oldPairCleanup) setTimeout(() => { try { oldPairCleanup(); } catch (e) { } }, NAV_MS + 20);

  if (hash === '#/home') return renderHome();
  if (hash === '#/ai') return renderSetupAI();
  if (hash === '#/spectate') return renderSetupSpectate();
  if (hash === '#/local') return renderSetupLocal();
  if (hash === '#/host') return renderSetupHost();
  if (hash === '#/join') return renderSetupJoin();
  if (hash === '#/puzzles') return renderPuzzles();
  if (hash.startsWith('#/puzcat')) return renderPuzCat(hash.split('/')[2]);
  if (hash === '#/library') return renderLibrary();
  if (hash.startsWith('#/opening')) return renderOpening(hash.split('/')[2]);
  if (hash === '#/records') return renderRecords();
  if (hash.startsWith('#/review')) return renderReview(hash.split('/')[2]);
  if (hash === '#/settings') return renderSettings();
  if (hash === '#/pair-host' || hash === '#/pair-guest' || hash === '#/game') {
    if (hash !== '#/game') show('screen-pair');
    return; // 由流程函数填充
  }
  return renderHome();
}

function pzTag(pz, done) {
  if (done) return '已通关 · ' + done.bestMoves + '回合';
  if (pz.type === 'win') return '例胜 · 红先';
  if (pz.type === 'draw') return '守和 · 执黑';
  return pz.mate + '步杀';
}
// 残局分类聚合(动态, 不硬编码局数): 按 PUZZLE_CHAPTERS.test 实时过滤
function puzzleChapters() {
  return PUZZLE_CHAPTERS.map(ch => ({ ch, list: PUZZLES.filter(ch.test) })).filter(x => x.list.length);
}
// 分类图标配色: 杀局红、古谱青、例胜橙、守和蓝(视觉区分)
function pzCatCls(ch) {
  if (ch.id === 'endgame-win') return 'pzc-win';
  if (ch.id === 'endgame-draw') return 'pzc-draw';
  if (ch.id === 'classic') return 'pzc-classic';
  return 'pzc-mate';
}
