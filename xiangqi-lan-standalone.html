// ---------- 局面索引(FEN -> 库内下一着), 供 AI 走定式 ----------
// 同局面同着法可来自多条开局线: 聚合计权, 走法按权重加权随机抽取。
const BOOK = new Map(); // fen -> [{from,to,name,w}]
let maxBookPly = 0;
for (const op of OPENINGS) {
  if (op.book === false || op.fen) continue; // 古谱全局/名局鉴赏仅供打谱, 不入 AI 开局库
  const s = createState();
  const w = op.w || 1; // 主流体系权重略高, 但任何合理首着/分支权重均 >0
  for (let i = 0; i < op.moves.length; i++) {
    const m = parseMove(s, op.moves[i]);
    if (!m) break; // 库着法在该局面不合法, 中止本局索引
    const fen = toFEN(s);
    if (!BOOK.has(fen)) BOOK.set(fen, []);
    const arr = BOOK.get(fen);
    const dup = arr.find(c => c.from[0] === m.from[0] && c.from[1] === m.from[1] && c.to[0] === m.to[0] && c.to[1] === m.to[1]);
    if (dup) dup.w += w; // 同着法权重累加
    else arr.push({ from: m.from, to: m.to, name: op.name, w });
    applyMove(s, m.from, m.to);
    maxBookPly = Math.max(maxBookPly, i + 1);
  }
}

// 命中开局库则返回一着定式(同局面多套定式时按权重加权随机), 否则 null
function openingBookMove(state, rng = Math.random) {
  if (state.jieqi) return null;
  if (!state.moves || state.moves.length > maxBookPly) return null;
  const arr = BOOK.get(toFEN(state));
  if (!arr || !arr.length) return null;
  let total = 0;
  for (const c of arr) total += (c.w || 1);
  let r = rng() * total, pick = arr[arr.length - 1];
  for (const c of arr) { r -= (c.w || 1); if (r <= 0) { pick = c; break; } }
  return { from: pick.from, to: pick.to, bookName: pick.name };
}

// 判断指定着法是否为开局库定式着(复盘分析时库内着法直接认定为正着)
function openingHasMove(state, from, to) {
  if (state.jieqi || !state.moves || state.moves.length > maxBookPly) return false;
  const arr = BOOK.get(toFEN(state));
  return !!(arr && arr.some(c => c.from[0] === from[0] && c.from[1] === from[1]
    && c.to[0] === to[0] && c.to[1] === to[1]));
}

// 外层 g.piece 负责位置(CSS transform, transition 滑动);

// ============================================================


const W = 1000, M = 62, CELL = (W - 2 * M) / 8, H = 2 * M + 9 * CELL, R = 47;
const px = (x) => M + x * CELL;
const py = (y) => M + y * CELL;
const SVGNS = 'http://www.w3.org/2000/svg';

class BoardView {
  constructor(container, opts = {}) {
    this.container = container;
    this.viewSide = opts.viewSide || 'r';
    // 同台对坐模式: 棋盘固定不翻转, 黑方棋子/河界文字旋转 180° 朝黑方(手机上侧)

    this.onMove = opts.onMove || (() => { });

    this.sel = null;
    this.lastMove = null;
    this.checkSide = null;

  _reduced() {

    <svg class="board-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="pieceFace" cx="38%" cy="32%" r="75%">
          <stop offset="0%" stop-color="#fbf1d8"/><stop offset="70%" stop-color="#f3e0b8"/><stop offset="100%" stop-color="#e6c98f"/>
        </radialGradient>
        <radialGradient id="pieceDark" cx="38%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#a85a40"/><stop offset="70%" stop-color="#7d3d29"/><stop offset="100%" stop-color="#55261a"/>
        </radialGradient>
        <filter id="pieceShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a2208" flood-opacity="0.45"/>
        </filter>
      </defs>
      <g class="board-rotate">
        <rect x="6" y="6" rx="26" width="${W - 12}" height="${H - 12}" class="board-bg" fill="#f0d3a0"/>
        <g class="lines"></g>
        <g class="river"></g>
        <g class="palaces"></g>
        <g class="markers"></g>
        <g class="hints"></g>
        <g class="pieces"></g>
      </g>
    </svg>`;
    this.root = root;
    this.container.appendChild(root);
    const svg = root.querySelector('svg');
    this.svg = svg;
    this.gLines = root.querySelector('.lines');
    this.gRiver = root.querySelector('.river');
    this.gPalaces = root.querySelector('.palaces');
    this.gMarkers = root.querySelector('.markers');
    this.gHints = root.querySelector('.hints');
    this.gPieces = root.querySelector('.pieces');

  _line(x1, y1, x2, y2, cls = '') { this.el('line', { x1, y1, x2, y2, class: 'grid-line ' + cls }, this.gLines); }
  _drawLines() {
    // 横线 10 条
    for (let y = 0; y <= 9; y++) this._line(px(0), py(y), px(8), py(y));
    // 竖线 9 条(河界中断, 边线贯通)
    for (let x = 0; x <= 8; x++) {
      if (x === 0 || x === 8) this._line(px(x), py(0), px(x), py(9));
      else { this._line(px(x), py(0), px(x), py(4)); this._line(px(x), py(5), px(x), py(9)); }
    }
    // 九宫斜线
    const pal = (y1, y2) => {
      this.el('line', { x1: px(3), y1: py(y1), x2: px(5), y2: py(y2), class: 'grid-line thin' }, this.gPalaces);
      this.el('line', { x1: px(5), y1: py(y1), x2: px(3), y2: py(y2), class: 'grid-line thin' }, this.gPalaces);
    };
    pal(0, 2); pal(7, 9);
    // 楚河汉界(对坐模式: 楚河朝黑方旋转180°, 汉界朝红方, 两人各见正立文字)
    const ry = (py(4) + py(5)) / 2;
    // 用嵌套 g + attribute transform 旋转(避开 CSS transform-box 对 SVG text 的怪异处理)
    const g1 = this.el('g', this.dualView ? { transform: `rotate(180 ${px(2)} ${ry})` } : {}, this.gRiver);
    const t1 = this.el('text', { x: px(2), y: ry, class: 'river-text' }, g1);
    t1.textContent = '楚 河';
    const t2 = this.el('text', { x: px(6), y: ry, class: 'river-text' }, this.gRiver);
    t2.textContent = '汉 界';
    // 炮位/兵位角标(四象限 L 形)
    const mark = (x, y) => {
      const o = R + 7, l = 17, s = 8;
      for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        const bx = x + dx, by = y + dy;
        if (bx < 0 || bx > 8 || by < 0 || by > 9) continue;
        if (((y === 4 && by === 5) || (y === 5 && by === 4)) && x > 0 && x < 8) continue;
        const cx = px(x) + dx * o, cy = py(y) + dy * o;
        this.el('line', { x1: cx, y1: cy + dy * s, x2: cx + dx * l, y2: cy + dy * s, class: 'grid-line thin' }, this.gMarkers);
        this.el('line', { x1: cx + dx * s, y1: cy, x2: cx + dx * s, y2: cy + dy * l }, this.gMarkers);
      }
    };
    for (const [x, y] of [[1, 2], [7, 2], [1, 7], [7, 7],
      [0, 3], [2, 3], [4, 3], [6, 3], [8, 3], [0, 6], [2, 6], [4, 6], [6, 6], [8, 6]]) mark(x, y);
  }
  setViewSide(side) {
    this.viewSide = side;
    if (this.dualView) {
      // 对坐模式棋盘永不整体翻转
      this.root.querySelector('.board-rotate').setAttribute('transform', '');
      this.root.classList.remove('flipped');
      return;
    }
    this.root.querySelector('.board-rotate').setAttribute('transform', side === 'b' ? `rotate(180 ${W / 2} ${H / 2})` : '');
    this.root.classList.toggle('flipped', side === 'b');
  }
  setState(state) { this.state = state; this.render(); }
  setInteractive(v) { this.interactive = v; }
  // 交接到新行棋方/对方应招结束时, 清除上一步遗留的落子动画锁
  clearMoveLock() { this._moveLockUntil = 0; }
  setLastMove(m) { this.lastMove = m; this._drawHints(); }
  setCheck(side) {
    const was = this.checkSide;
    this.checkSide = side;
    if (side && side !== was) this._checkFxEdge(side);      // 无将军 -> 有将军: 边沿触发一次
    else if (!side && was) this._clearCheckFx();           // 将军解除
    // 仅重绘提示层增删 check-ring, 不重建棋子(避免二次 render 重置吃子飞离方向/定时器)
    this._drawHints();
  }

  _tap(e) {
    if (!this.interactive || !this.state) return;
    // 注意: 落子动画锁(_moveLockUntil)不在此整体拦截, 否则新行棋方在快速应招
    // (入门AI/残局/无交接同台)后, 回合开头的"选子"点击会被上一步遗留的锁吞掉,
    // 表现为"下一步被直接跳过"。锁只在 onTap 内拦截"落子", 选子始终放行。
    const rect = this.svg.getBoundingClientRect();
    let lx = (e.clientX - rect.left) / rect.width * W;
    let ly = (e.clientY - rect.top) / rect.height * H;
    if (this.viewSide === 'b') { lx = W - lx; ly = H - ly; }
    const x = Math.round((lx - M) / CELL), y = Math.round((ly - M) / CELL);
    if (x < 0 || x > 8 || y < 0 || y > 9) return;
    // 不再用 0.45 格硬容差拒绝边缘点击: Math.round 已把触点归到最近交叉点,
    // 全盘按"最近邻"响应(每个交叉点独占半格 Voronoi 区), 点棋子边缘/两子缝隙
    // 也能稳定命中; 点到无棋子的空位由 onTap 安全地当作取消选择处理
    this.onTap(x, y);
  }
  onTap(x, y) {
    const p = this.state.board[y][x];
    if (this.sel) {
      const [fx, fy] = this.sel;
      const targets = legalTargetsFrom(this.state, fx, fy);
      if (targets.some(t => t[0] === x && t[1] === y)) {
        // 落子动画窗口内: 仅暂缓"落子", 保留选中态与落点提示。
        // 这样新行棋方任何时刻都能先选中棋子(跟手), 极端快速的连点最多让"落子"
        // 顺延一次点击(选中仍在), 绝不会把一整步无声吞掉。
        if (performance.now() < (this._moveLockUntil || 0)) return;

        this._moveLockUntil = performance.now() + 320; // 与棋子滑动 .3s + 落子顿感对齐

  showHintsFromAI(from, to) {

  }
  clearHint() { this.sel = null; this._drawHints(); }
  _drawHints(aiHintTo) {

    const targets = aiHintTo ? [aiHintTo] : legalTargetsFrom(this.state, fx, fy);
    for (const [tx, ty] of targets) {

  }
  _kingPos(c) {
    for (let y = 0; y <= 9; y++) for (let x = 0; x <= 8; x++) {
      const p = this.state.board[y][x];
      if (p && p.c === c && p.t === 'K') return [x, y];
    }
    return null;
  }

  // 特征键: 用于跨 undo 重建(棋子 id 全变)后的节点匹配
  _dk(p) { return p.c + '|' + p.t + '|' + (p.hidden ? 1 : 0); }

  render() {
    if (!this.state) return;
    // 1) 快照现存棋子节点(数组, 容忍同格多节点——吃子删除窗口内被吃子仍在 DOM)
    const prev = [];
    for (const g of this.gPieces.children) {
      const x = g.dataset && g.dataset.x;
      if (x == null || x === '') continue;
      prev.push(g);
    }
    const used = new Set();
    const bind = new Map();   // cur -> g
    const cur = [];
    for (let y = 0; y <= 9; y++) for (let x = 0; x <= 8; x++) {

    const unbound = [];
    for (const c of cur) {
      let g = null;
      for (const pg of prev) {
        if (used.has(pg)) continue;
        if (+pg.dataset.x === c.x && +pg.dataset.y === c.y && pg._dk === this._dk(c.p)) { g = pg; break; }
      }
      if (g) {

          g._inner.style.removeProperty('--fx-flyx');
          g._inner.style.removeProperty('--fx-flyy');

      } else unbound.push(c);
    }

    // ---- 阶段B: 剩余当前子 × 剩余存活节点, 全局最小距离配对(排除 _dead 节点) ----
    let free = prev.filter(g => !used.has(g) && !g._dead && !g.classList.contains('fx-captured'));
    while (unbound.length && free.length) {
      let bestD = Infinity, bi = -1, bj = -1;
      for (let i = 0; i < unbound.length; i++) {
        for (let j = 0; j < free.length; j++) {
          const g = free[j];
          if (!compatible(g, unbound[i].p)) continue;
          const d = (+g.dataset.x - unbound[i].x) ** 2 + (+g.dataset.y - unbound[i].y) ** 2;
          if (d < bestD) { bestD = d; bi = i; bj = j; }
        }
      }
      if (bi < 0) break; // 再无可配对
      used.add(free[bj]);

      unbound.splice(bi, 1);
      free.splice(bj, 1);
    }

    const fresh = new Set();
    // 仅"本帧"跨格回场的节点: 其定位交给 _enterFromGraveyard 的双 rAF 落位,
    // 只在这一帧跳过直接定位; 绝不能把标记长期留在节点上, 否则该子以后每一帧都被
    // 跳过 transform 更新 -> 逻辑/dataset 已走、视觉却永久卡在原地("棋子移不动/
    // 移动与判定不一致", 悔棋、残局重摆后必现)。
    const crossReturning = new Set();
    for (const c of unbound) {
      const g = this._makePiece(c.p);
      if (this._enterFromGraveyard(g, c.p, c.x, c.y)) crossReturning.add(g);
      bind.set(c, g);
      fresh.add(g);

    // ---- 统计真移动子(绑定节点来自不同格) ----
    const moves = [];
    const movers = new Set();
    const plan = [];
    for (const c of cur) {
      const g = bind.get(c);
      let moved = false;
      if (!fresh.has(g)) {
        const ox = +g.dataset.x, oy = +g.dataset.y;
        if (ox !== c.x || oy !== c.y) { moved = true; moves.push({ fx: ox, fy: oy, tx: c.x, ty: c.y }); movers.add(g); }
      }
      plan.push({ g, p: c.p, x: c.x, y: c.y, moved });
    }

    // 批量载入: 多子同时换位(联机 restore / 复盘跳多步 / 重开) -> 即时就位不播动画
    const batch = movers.size > 2;
    if (batch) {

    // ---- 应用位置与视觉 ----
    for (const { g, p, x, y, moved } of plan) {
      g.classList.remove('fx-captured', 'fx-ghost');
      clearTimeout(g._removeT);
      g.dataset.x = x; g.dataset.y = y;
      // 仅本帧跨格回场节点: transform 由 _enterFromGraveyard 双 rAF 落位(保证滑动可插值);
      // 此后每帧一律正常定位(跨格标记是当帧局部态, 不在节点上滞留)。
      if (!crossReturning.has(g)) {
        const rot = (this.dualView && p.c === 'b') ? ' rotate(180deg)' : '';
        g.style.transform = `translate(${px(x).toFixed(1)}px,${py(y).toFixed(1)}px)${rot}`;
      }
      this._syncVisual(g, p);
      if (moved && !batch && !this._reduced()) this._liftMove(g);

    // ---- 未被绑定的 prev 节点 = 被吃/消失 ----
    const now = Date.now();
    for (const g of prev) {
      if (used.has(g) || g._dead) continue;
      if (batch) { g.remove(); continue; }
      const cx = +g.dataset.x, cy = +g.dataset.y;
      const mv = moves.find(m => m.tx === cx && m.ty === cy);
      let fx = 0, fy = -46;
      if (mv) {
        const dx = cx - mv.fx, dy = cy - mv.fy;
        const len = Math.hypot(dx, dy) || 1;
        fx = (dx / len) * 78; fy = (dy / len) * 78;
      }
      this._graveyard.set(cx + ',' + cy + '|' + g._dk, { born: now });
      g._inner.style.setProperty('--fx-flyx', fx.toFixed(1) + 'px');
      g._inner.style.setProperty('--fx-flyy', fy.toFixed(1) + 'px');
      g.classList.remove('fx-moving', 'fx-land');
      g.classList.add('fx-captured');
      g._dead = true;
      clearTimeout(g._landT);
      clearTimeout(g._removeT);
      g._removeT = setTimeout(() => g.remove(), 300);
    }

    // 首次铺盘: 先无过渡铺好, 再下一帧启用过渡
    if (!this._primed) {
      this.root.classList.add('fx-warm');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        this.root.classList.remove('fx-warm');

    }

    // 否则下一次点击会先按这个失效选中判定落点而被"吞掉"(表现为点了没反应)
    if (this.sel) {
      const [sx, sy] = this.sel;
      const sp = this.state.board[sy] && this.state.board[sy][sx];
      if (!sp || sp.c !== this.state.turn) this.sel = null;
    }
    this.setViewSide(this.viewSide);
    this._drawHints();
  }

  // 新节点: 若近期有被吃登记 -> 从被吃状态反向回场
  //  ① 目标格|dk 精确命中: 原地 fx-ghost 淡入(维持原行为)
  //  ② 未命中: 取同 dk 时间窗内最近一条登记(登记格 gx,gy=真实被吃处) -> 跨格回场:
  //     先置于死亡格 + fx-ghost(极小/透明), reflow 后双 rAF 再滑到目标格并 unghost
  // 返回 true 表示发生了"跨格回场"(本帧定位由内部双 rAF 负责, 调用方本帧跳过直接定位)
  _enterFromGraveyard(g, p, x, y) {
    const dk = g._dk;
    const gk = x + ',' + y + '|' + dk;
    let gv = this._graveyard.get(gk);
    let death = null;
    if (gv) {
      this._graveyard.delete(gk);
    } else if (this._primed) {
      // 同色同类、时间窗内最近一条
      let best = null, bestKey = null, bestBorn = -1;
      for (const [key, v] of this._graveyard) {
        const bar = key.indexOf('|');
        if (key.slice(bar + 1) !== dk) continue;
        if (v.born > bestBorn) { bestBorn = v.born; best = v; bestKey = key; death = key.slice(0, bar).split(',').map(Number); }
      }
      if (best) { this._graveyard.delete(bestKey); gv = best; }
    }
    if (!this._primed || !gv || this._reduced()) return false; // 初盘/减弱: 交给应用循环直接就位
    const rot = (this.dualView && p.c === 'b') ? ' rotate(180deg)' : '';
    if (death) {
      // 跨格回场: 初始帧置于死亡格(极小/透明), 双 rAF 后滑到目标格并落定;
      // 不在节点上保留任何持久"跳过定位"标记(历史 bug: 标记滞留导致该子以后视觉卡死)。
      g.style.transform = `translate(${px(death[0]).toFixed(1)}px,${py(death[1]).toFixed(1)}px)${rot}`;
      g.classList.add('fx-ghost');
      void g.getBoundingClientRect();              // 强制首帧落定死亡格
      const r1 = requestAnimationFrame(() => {
        this._crossRafs.delete(r1);
        const r2 = requestAnimationFrame(() => {
          this._crossRafs.delete(r2);
          // 幽灵态总要解除; 但仅当这两帧内节点未被新 render 移到别处, 才按闭包坐标落位,
          // 避免晚到帧用旧坐标覆盖新局面(历史 bug: 悔棋/重摆后该子视觉错位)。
          g.classList.remove('fx-ghost');
          if (+g.dataset.x === x && +g.dataset.y === y) {
            g.style.transform = `translate(${px(x).toFixed(1)}px,${py(y).toFixed(1)}px)${rot}`;
          }
        });
        this._crossRafs.add(r2);
      });
      this._crossRafs.add(r1);
      return true;
    }
    // 原地回场: 极小/透明淡入回升, 定位仍由应用循环负责
    g.classList.add('fx-ghost');
    void g.getBoundingClientRect();
    requestAnimationFrame(() => requestAnimationFrame(() => g.classList.remove('fx-ghost')));
    return false;
  }

  _liftMove(g) {
    if (this._reduced()) return;
    g.classList.add('fx-moving');
    clearTimeout(g._landT);
    g._landT = setTimeout(() => {
      g.classList.remove('fx-moving');
      g.classList.add('fx-land');
      setTimeout(() => g.classList.remove('fx-land'), 340);
    }, 280);
  }

  _syncVisual(g, p) {
    const wasHidden = !!g._hidden;
    const nowHidden = !!p.hidden;
    g._c = p.c; g._dk = this._dk(p);
    if (wasHidden && !nowHidden) {
      this._flip(g, p);
    } else {
      g.classList.toggle('dark', nowHidden);
      const txt = g.querySelector('.p-text');
      txt.textContent = nowHidden ? '棋' : (NAMES[p.c][p.t] || '');
    }
    g._hidden = nowHidden;
  }

  _flip(g, p) {
    g.classList.add('flipping');
    setTimeout(() => {
      g.classList.remove('dark');
      g.querySelector('.p-text').textContent = NAMES[p.c][p.t] || '';
      g.querySelector('.p-face').setAttribute('fill', 'url(#pieceFace)');
    }, 170);
    setTimeout(() => g.classList.remove('flipping'), 360);
  }
  _makePiece(p) {
    const g = this.el('g', { class: 'piece' + (p.hidden ? ' dark' : ''), 'data-id': p.id }, this.gPieces);
    g._c = p.c; g._dk = this._dk(p); g._hidden = !!p.hidden;
    const inner = this.el('g', { class: 'fx-inner' }, g);
    g._inner = inner;
    this.el('circle', { class: 'p-shadow', r: R, fill: 'none' }, inner);
    this.el('circle', { class: 'p-face', r: R, fill: p.hidden ? 'url(#pieceDark)' : 'url(#pieceFace)', filter: 'url(#pieceShadow)' }, inner);
    this.el('circle', { class: 'p-ring1', r: R - 1, fill: 'none' }, inner);
    this.el('circle', { class: 'p-ring2', r: R - 7, fill: 'none' }, inner);
    const txt = this.el('text', { class: 'p-text p-' + p.c, x: 0, y: 2 }, inner);
    txt.textContent = p.hidden ? '棋' : NAMES[p.c][p.t] || '';
    return g;
  }
  destroy() {
    clearTimeout(this._checkTimer);
    clearTimeout(this._endTimer);
    for (const id of this._crossRafs) cancelAnimationFrame(id);
    this._crossRafs.clear();
    for (const g of this.gPieces.children) {
      clearTimeout(g._landT);
      clearTimeout(g._removeT);
    }
    this.root.remove();
  }

  // ============================================================
  // 将军 / 绝杀分级特效
  // ============================================================
  // 普通将军边沿触发: 棋盘震动 + 「将军」浮字 + 帅位红圈增强
  _checkFxEdge(side) {
    if (this._reduced()) return;
    this._clearCheckFx();
    this.root.classList.add('fx-shake', 'fx-checkglow');
    const word = document.createElement('div');
    word.className = 'fx-word fx-word-check';
    word.textContent = '将 军';
    this.root.appendChild(word);
    this._checkTimer = setTimeout(() => this._clearCheckFx(), 1100);
  }
  _clearCheckFx() {
    clearTimeout(this._checkTimer);
    this.root.classList.remove('fx-shake', 'fx-checkglow');
    this.root.querySelector('.fx-word-check')?.remove();
  }

  // 清理胜/负方棋子高亮/暗化 与 帅位临时光环
  _clearEndPieceFx() {
    for (const g of this.gPieces.children) g.classList && g.classList.remove('fx-win', 'fx-lose');
    this.root.classList.remove('fx-checkglow');
    this._endRing?.remove(); this._endRing = null;
  }

  // 终局分级特效; 返回建议延迟(ms), 0 表示立即弹窗
  // grade: 'mate'(将死) | 'stalemate'(困毙) | 'draw'(和棋) | 'light'(认输/超时等)
  playEnd(grade) {
    this.root.querySelector('.fx-end')?.remove();
    this._clearEndPieceFx();
    clearTimeout(this._endTimer);
    if (this._reduced() || !grade || grade === 'light') return 0;
    const ov = document.createElement('div');
    ov.className = 'fx-end fx-end-' + grade;
    if (grade === 'mate') {
      const rays = document.createElement('div');
      rays.className = 'fx-rays';
      for (let i = 0; i < 12; i++) {
        const r = document.createElement('i');
        r.style.transform = `rotate(${i * 30}deg)`;
        rays.appendChild(r);
      }
      ov.appendChild(rays);
      const flash = document.createElement('div'); flash.className = 'fx-flash'; ov.appendChild(flash);
      const word = document.createElement('div'); word.className = 'fx-word fx-word-win'; word.textContent = '绝杀'; ov.appendChild(word);
      const cf = document.createElement('div'); cf.className = 'fx-confetti'; ov.appendChild(cf);
      for (let i = 0; i < 12; i++) {
        const c = document.createElement('i');
        c.style.left = (6 + Math.random() * 88) + '%';
        c.style.background = ['#e8a93a', '#c0402e', '#f5d488', '#fff3d0', '#d2281e'][i % 5];
        cf.appendChild(c);
      }
      // 胜方高亮 / 负方暗化; state.turn 为被将死(负)方
      const loser = this.state && this.state.turn;
      if (loser) {
        const winner = loser === 'r' ? 'b' : 'r';
        for (const g of this.gPieces.children) {
          if (!g._c) continue;
          g.classList.add(g._c === loser ? 'fx-lose' : 'fx-win');
        }
        // 负方帅位红色强光环(复用 check-ring + fx-checkglow)
        const kp = this._kingPos(loser);
        if (kp) {
          this._endRing = this.el('circle', { cx: px(kp[0]), cy: py(kp[1]), r: R + 6, class: 'check-ring' }, this.gHints);
          this.root.classList.add('fx-checkglow');
        }
      }
    } else if (grade === 'draw') {
      const word = document.createElement('div'); word.className = 'fx-word fx-word-neutral'; word.textContent = '和棋'; ov.appendChild(word);
    } else if (grade === 'stalemate') {
      const word = document.createElement('div'); word.className = 'fx-word fx-word-stale'; word.textContent = '困毙'; ov.appendChild(word);
    }
    this.root.appendChild(ov);
    const dur = grade === 'mate' ? 1000 : (grade === 'draw' || grade === 'stalemate') ? 750 : 300;
    this._endTimer = setTimeout(() => { ov.remove(); this._clearEndPieceFx(); }, dur + 400);
    return dur;
  }

  // ============================================================
  // 对外动画 API(供 controller 在将军/终局处一行调用; classic 主题自动静默为朴素反馈)
  // ============================================================
  // 走子/悔棋过渡: 棋子滑动与起落由 render() 自动驱动, 这里仅作显式钩子(可空播/补 lift)。
  // 返回建议等待 ms, 0 表示无需等待。
  playMoveAnim(/* from, to */) { return this._reduced() ? 0 : 320; }
  // 将军动画: 棋盘轻震 + 「将军」浮字 + 帅位红圈增强(边沿一次)
  playCheckAnim(side) { if (this._reduced()) return 0; this.setCheck(side); return 1100; }
  // 绝杀/和棋/困毙终局动画: 放射爆发+浮字+礼花(胜)/中性脉冲; 返回建议弹窗延迟 ms
  playMateAnim(grade = 'mate') { return this.playEnd(grade); }
}

let ctx = null;

function soundEnabled() {
  try { const v = localStorage.getItem('xq_sound'); return v === null ? true : v === '1'; } catch (e) { return true; }
}
function ac() {
  if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }

  return ctx;
}
function tone({ freq = 440, dur = 0.08, type = 'sine', gain = 0.18, slideTo, delay = 0 }) {
  const c = ac(); if (!c || !enabled) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise({ dur = 0.06, gain = 0.12, freq = 1200, delay = 0 }) {
  const c = ac(); if (!c || !enabled) return;
  const t0 = c.currentTime + delay;
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
  const g = c.createGain(); g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(c.destination);
  src.start(t0);
}

// 轻量弹层: toast / modal / confirm / sheet
function h(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function safeGet(k, d) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; }
}
function safeSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

const store = {
  // 战绩/棋谱
  records: () => safeGet(K_REC, []),

    const list = safeGet(K_REC, []);
    const rec = { id: Date.now() + '' + Math.floor(Math.random() * 1000), at: Date.now(), ...r };
    list.unshift(rec);
    safeSet(K_REC, list.slice(0, 100));
    return rec;
  },
  removeRecord(id) { safeSet(K_REC, safeGet(K_REC, []).filter(r => r.id !== id)); },
  clearRecords() { safeSet(K_REC, []); },

  // 残局进度 { [id]: {stars:1-3, bestMoves:n} }
  puzzleProgress: () => safeGet(K_PZ, {}),
  setPuzzleResult(id, movesUsed) {
    const p = safeGet(K_PZ, {});
    const old = p[id];
    p[id] = old ? { ...old, bestMoves: Math.min(old.bestMoves, movesUsed), count: (old.count || 0) + 1 }
      : { bestMoves: movesUsed, count: 1 };
    safeSet(K_PZ, p);
    return p[id];
  },

  // 设置

  saveSettings(patch) { safeSet(K_SET, { ...safeGet(K_SET, {}), ...patch }); },

  // AI 复盘分析缓存 { [recordId]: report }
  analysis: () => safeGet(K_AN, {}),
  getAnalysis(id) { return safeGet(K_AN, {})[id] || null; },
  saveAnalysis(id, report) {
    const all = safeGet(K_AN, {});

    // 仅保留最近 20 份, 控制本地体积
    const keys = Object.keys(all).sort((a, b) => all[b].at - all[a].at).slice(0, 20);
    const trimmed = {}; for (const k of keys) trimmed[k] = all[k];
    safeSet(K_AN, trimmed);
  },
  clearAnalysis(id) { const all = safeGet(K_AN, {}); delete all[id]; safeSet(K_AN, all); }
};

async function sha256(text) {
  const bytes = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function randomSalt() {
  return Array.from({ length: 8 }, () => Math.floor(Math.random() * 256).toString(16).padStart(2, '0')).join('');
}
const pk = (x, y) => `${x},${y}`;
const JIEQI_SLOTS = {

function parseClock(rules) {
  const t = TIME_RULES[rules.time] || TIME_RULES.none;

// ============================================================
// HostRoom (房主=红方, 权威)
// ============================================================
class HostRoom {
  constructor({ name = '房主', rules = { jieqi: false, time: '10' } } = {}) {
    this.hostName = name;
    this.rules = rules;
    this.hostColor = 'r';
    this.peers = new Map();
    this.seats = { r: { id: '__host__', name }, b: null };
    this.state = null;
    this.started = false;
    this.over = false;
    this.clock = null;
    this.evt = [];
    this.jieqi = !!rules.jieqi;
    this.permB = null; this.saltB = null; this.commitB = null;
    this.commitR = null;
    this.pendingReveal = null;
    this.undoPending = false;
    this.drawPending = false;
    this.offlineMs = 90000;
    this._idc = 0;
    this._tokenSeq = 0;
    this.dead = false;
  }
  onEvent(cb) { this.evt.push(cb); }
  emit(type, data = {}) { if (this.dead) return; for (const cb of this.evt) cb({ type, ...data }); }
  nextId() { return 'p' + (++this._idc); }
  // 重连确定性令牌: 与具体 WebRTC 连接解耦, 由 guest 持久缓存, 断线重扫后凭它找回原席位
  _issueToken() { return 'tok' + (++this._tokenSeq) + '_' + Math.random().toString(36).slice(2, 8); }
  // 房主主动离开/会话销毁: 先通知所有 peer "我是主动离开"(供其区分 离开/掉线),
  // 再摘除所有 peer 传输回调与监听, 此后 close/消息不再驱动对局
  destroy() {
    this.dead = true;
    this.broadcast({ type: 'bye', reason: 'host-left' });
    for (const p of this.peers.values()) {
      try { if (p.transport) { p.transport.onMessage = null; p.transport.onClose = null; } } catch (e) { }
    }
    this.evt.length = 0;
  }

  addTransport(transport) {
    const id = transport.id || (transport.id = this.nextId());
    transport.onMessage = (msg) => this.handle(id, msg);
    transport.onClose = () => this.onPeerClose(id);
    const token = this._issueToken();
    this.peers.set(id, { transport, name: transport.name || '棋友', role: null, online: true, deadline: 0, want: 'play', token });
    transport.send({ type: 'helloAck', id, hostName: this.hostName, peerToken: token, room: { rules: this.rules, started: this.started } });
    this.emitPeers();
    return id;
  }
  emitPeers() {
    const list = [...this.peers.values()].map(p => ({ name: p.name, role: p.role, online: p.online }));
    this.emit('peers', { peers: list });
  }

  handle(id, msg) {
    const peer = this.peers.get(id);
    if (!peer) return;
    switch (msg.type) {
      case 'hello': {
        if (msg.reconnect) {
          // 优先按持久令牌精确找回原 peer(同席位), 回退到 名字+对局角色 兼容旧客户端
          let entry = msg.token ? [...this.peers.entries()].find(([, p]) => p.token === msg.token && !p.online) : null;
          if (!entry) entry = [...this.peers.entries()].find(([, p]) => p.name === msg.name && !p.online && (p.role === 'r' || p.role === 'b'));
          if (entry) { this.reconnect(entry[0], id, peer); return; }
        }
        peer.name = msg.name || peer.name;
        peer.want = msg.want || 'play';
        this.emitPeers();
        if (this.started) this.acceptJoin(id, 'spec');
        else this.emit('challenge', { peerId: id, name: peer.name, want: peer.want });
        break;
      }
      case 'bye': {
        // 对端主动离开(有别于网络中断): 若离开的是对局对手, 立即按"对方离开"结算, 不再等 90s 掉线判负
        const role = peer.role;
        peer.online = false; peer.deadline = 0;
        this.emit('peerLeft', { name: peer.name, role });
        if (role === 'b' && !this.over) { this.endGame('redwin', 'left'); }
        this.emitPeers();
        break;
      }
      case 'jieqiReady':
        this.commitR = msg.commit;
        this.beginGame();
        break;
      case 'move': {
        if (!this.started || this.over || this.state.status !== 'playing') return;
        if (!this.seats.b || this.seats.b.id !== id) return;
        this.guestMove(id, msg.from, msg.to);
        break;
      }
      case 'reveal': {
        if (this.pendingReveal && this.pendingReveal.peerId === id) {
          const pr = this.pendingReveal; this.pendingReveal = null;
          this.hostDoMove(pr.from, pr.to, msg.t);
        }
        break;
      }
      case 'undoReq':
        if (this.over) break;
        this.undoPending = true;
        this.emit('undoPending', { name: peer.name, fromPeer: id });
        break;
      case 'undoReply':
        if (this.undoPending && id === this.seats.b.id) {
          this.undoPending = false;
          if (msg.agree) this.doUndo();
          else this.emit('undoDeclined', { name: peer.name });
        }
        break;
      case 'drawReq':
        if (this.over) break;
        this.drawPending = true;
        this.emit('drawPending', { name: peer.name, fromPeer: id });
        break;
      case 'drawReply':
        if (this.drawPending && id === this.seats.b.id) {
          this.drawPending = false;
          if (msg.agree) this.endGame('draw', 'agreement');
          else this.emit('drawDeclined', { name: peer.name });
        }
        break;
      case 'resign':
        if (!this.over) this.endGame('redwin', 'resign'); // 黑方认输
        break;
      case 'revealAll': {
        // 终局: guest(黑) 公开红方排列, host 校验其承诺
        sha256(msg.salt + JSON.stringify(msg.perm)).then(h => {
          if (this.dead) return;
          const valid = (h === this.commitR);
          this.emit('revealAll', { side: msg.side, salt: msg.salt, perm: msg.perm, valid });
        });
        break;
      }
      case 'chat': {
        const payload = { type: 'chat', name: peer.name, role: peer.role, text: String(msg.text || '').slice(0, 80), ts: Date.now() };
        this.broadcast(payload, id); // 不回发发送者(其本地自行显示)
        this.emit('chat', payload);
        break;
      }
    }
  }

  reconnect(oldId, newId, newPeer) {
    const old = this.peers.get(oldId);
    const role = old.role;
    old.transport = newPeer.transport;
    old.online = true; old.deadline = 0;
    this.peers.delete(newId);
    old.transport.onMessage = (m) => this.handle(oldId, m);
    old.transport.onClose = () => this.onPeerClose(oldId);
    this.peers.set(oldId, old);
    old.transport.send({ type: 'reconnected', role });
    if (this.started) old.transport.send({ type: 'snapshot', state: this.viewFor(role), clock: this.clockView(), seat: role, rules: this.rules });
    this.emitPeers();
    this.broadcast({ type: 'peerBack', name: old.name });
  }

  onPeerClose(id) {
    if (this.dead) return;
    const peer = this.peers.get(id);
    if (!peer || !peer.online) return;
    peer.online = false; peer.deadline = Date.now() + this.offlineMs;
    this.broadcast({ type: 'peerOffline', name: peer.name, deadline: peer.deadline });
    this.emit('peerOffline', { name: peer.name, deadline: peer.deadline });
    this.emitPeers();
  }

  acceptJoin(id, role) {
    const peer = this.peers.get(id);
    if (!peer || peer.role) return;
    if (role === 'spec' || (role === 'b' && this.seats.b)) {
      peer.role = 'spec';
      peer.transport.send({ type: 'joined', role: 'spec', rules: this.rules });
      if (this.started) peer.transport.send({ type: 'snapshot', state: this.viewFor('spec'), clock: this.clockView(), seat: 'spec', rules: this.rules });
      this.emitPeers();
      this.broadcast({ type: 'specIn', name: peer.name });
      return;
    }
    peer.role = 'b';
    this.seats.b = { id, name: peer.name };
    peer.transport.send({ type: 'joined', role: 'b', rules: this.rules });
    this.emitPeers();
    if (this.jieqi) {
      const rng = mulberry32((Math.random() * 4294967296) >>> 0);
      this.permB = genPerm('b', rng);
      this.saltB = randomSalt();
      sha256(this.saltB + JSON.stringify(this.permB)).then(commit => {
        if (this.dead || this.commitB !== null) return;
        this.commitB = commit;
        peer.transport.send({ type: 'jieqiBegin', commit, yourSide: 'b' });
      });
    } else this.beginGame();
  }
  declineJoin(id, reason) {
    const peer = this.peers.get(id);
    if (peer) { peer.transport.send({ type: 'joinDeclined', reason }); }
    this.emitPeers();
  }

  beginGame() {
    if (this.started) return;
    let perms = null;
    if (this.jieqi) {
      const unk = (c) => Object.fromEntries(JIEQI_SLOTS[c].map(k => [k, '?']));
      perms = { r: unk('r'), b: unk('b') };
      Object.assign(perms.b, this.permB); // host 持有黑方排列(仅用于揭示, UI 不显示)
    }
    this.state = createState(this.jieqi ? { jieqi: true, perms } : {});
    this.clock = parseClock(this.rules);
    this.clock.lastTs = Date.now();
    this.started = true; this.over = false;
    const guestId = this.seats.b && this.seats.b.id;
    if (guestId && this.peers.has(guestId)) {
      this.peers.get(guestId).transport.send({
        type: 'startGame', rules: this.rules,
        state: this.viewFor('b'), clock: this.clockView(), seat: 'b', hostColor: 'r'
      });
    }
    this.emit('startGame', { state: this.state, seat: 'r' });
  }

  isLegal(from, to) {
    return legalTargetsFrom(this.state, from[0], from[1]).some(t => t[0] === to[0] && t[1] === to[1]);
  }
  localMove(from, to) {
    if (!this.started || this.over || this.state.status !== 'playing') return { ok: false };
    if (this.state.turn !== 'r') return { ok: false };
    if (!this.isLegal(from, to)) return { ok: false, illegal: true };
    const piece = this.state.board[from[1]][from[0]];
    if (this.jieqi && piece.hidden && piece.t === '?') {
      const opp = this.seats.b && this.peers.get(this.seats.b.id);
      if (opp) {
        this.pendingReveal = { from, to, peerId: this.seats.b.id };
        opp.transport.send({ type: 'needReveal', from, to });
        return { ok: true, pending: true };
      }
    }
    this.hostDoMove(from, to, null);
    return { ok: true };
  }
  hostDoMove(from, to, revealT) {
    const m = applyMove(this.state, from, to, revealT ? { revealT } : {});
    this.afterMove('r', m);
  }
  guestMove(id, from, to) {
    const peer = this.peers.get(id);
    if (this.state.turn !== 'b') return;
    if (!this.isLegal(from, to)) { peer.transport.send({ type: 'illegalMove' }); return; }
    let revealT = null;
    const piece = this.state.board[from[1]][from[0]];
    if (this.jieqi && piece.hidden && this.permB) revealT = this.permB[pk(from[0], from[1])];
    const m = applyMove(this.state, from, to, revealT ? { revealT } : {});
    this.afterMove('b', m);
  }
  afterMove(side, m) {
    const ended = this.state.status !== 'playing';
    this.settleClock(side, ended);
    const payload = {
      type: 'move', actor: side, from: m.from, to: m.to,
      reveal: m.reveal, capturedHidden: m.captured ? m.captured.hidden : false,
      notation: m.notation, check: !!m.check, ts: Date.now(),
      status: this.state.status, reason: this.state.reason, clock: this.clockView()
    };
    this.broadcast(payload);
    this.emit('move', { side, move: m });
    if (ended) this.endGame(this.state.status, this.state.reason);
  }
  // 走子方按钟
  settleClock(side, ended) {
    if (!this.clock || !this.clock.rule.base) return;
    const now = Date.now();
    const c = this.clock[side];
    const elapsed = now - this.clock.lastTs;
    this.clock.lastTs = now;
    if (c.phase === 'byo') { c.remain = this.clock.rule.byo * 1000; return; }
    c.remain -= elapsed;
    if (this.clock.rule.inc) c.remain += this.clock.rule.inc * 1000;
    if (c.remain <= 0) {
      if (this.clock.rule.byo) { c.phase = 'byo'; c.remain = this.clock.rule.byo * 1000; }
      else if (!ended) { c.remain = 0; this.endGame(side === 'r' ? 'blackwin' : 'redwin', 'timeout'); }
      else c.remain = 0;
    }
  }
  // UI 定时调用(约每 250ms); 推进当前行棋方时钟, 处理超时/断线判负
  tick(now = Date.now()) {
    if (!this.started || this.over || !this.clock) return;
    if (this.clock.rule.base && this.state.status === 'playing') {
      const side = this.state.turn;
      const c = this.clock[side];
      const elapsed = now - this.clock.lastTs;
      this.clock.lastTs = now;
      c.remain -= elapsed;
      if (c.remain <= 0) {
        if (c.phase === 'base' && this.clock.rule.byo) {
          c.phase = 'byo'; c.remain = this.clock.rule.byo * 1000;
          this.broadcast({ type: 'clock', clock: this.clockView() });
        } else {
          c.remain = 0; this.endGame(side === 'r' ? 'blackwin' : 'redwin', 'timeout'); return;
        }
      }
    }
    for (const [, p] of this.peers) {
      if ((p.role === 'r' || p.role === 'b') && !p.online && now > p.deadline) {
        this.endGame(p.role === 'r' ? 'blackwin' : 'redwin', 'offline');
      }
    }
  }
  clockView() { return this.clock ? JSON.parse(JSON.stringify(this.clock)) : null; }

  replyUndo(agree) {
    if (!this.undoPending) return;
    this.undoPending = false;
    const p = this.peers.get(this.seats.b.id);
    if (agree) { this.doUndo(); if (p) p.transport.send({ type: 'undoReply', agree: true }); }
    else if (p) p.transport.send({ type: 'undoReply', agree: false });
  }
  replyDraw(agree) {
    if (!this.drawPending) return;
    this.drawPending = false;
    const p = this.peers.get(this.seats.b.id);
    if (agree) this.endGame('draw', 'agreement');
    else if (p) p.transport.send({ type: 'drawReply', agree: false });
  }
  doUndo() {
    const n = Math.min(2, this.state.moves.length);
    undoMoves(this.state, n);
    this.over = false;
    this.broadcast({ type: 'snapshot', state: this.viewFor('b'), clock: this.clockView(), seat: 'b', rules: this.rules });
    this.emit('undo', {});
  }
  localUndoReq() {
    const p = this.peers.get(this.seats.b.id);
    if (p) { this.undoPending = true; p.transport.send({ type: 'undoReq', name: this.hostName }); }
  }
  localDrawReq() {
    const p = this.peers.get(this.seats.b.id);
    if (p) { this.drawPending = true; p.transport.send({ type: 'drawReq', name: this.hostName }); }
  }
  localResign() { if (!this.over) this.endGame('blackwin', 'resign'); }
  sendChat(text) {
    const payload = { type: 'chat', name: this.hostName, role: 'r', text: String(text || '').slice(0, 80), ts: Date.now() };
    this.broadcast(payload);
    this.emit('chat', payload);
  }

  endGame(status, reason) {
    if (this.over) return;
    this.over = true;
    if (this.state) { this.state.status = status; this.state.reason = reason; }
    const msg = { type: 'end', status, reason, clock: this.clockView() };
    if (this.jieqi && this.saltB) { msg.revealHost = { salt: this.saltB, perm: this.permB }; msg.wantReveal = true; }
    this.broadcast(msg);
    this.emit('end', { status, reason });
  }

  broadcast(msg, exceptId) {
    for (const [id, p] of this.peers) {
      if (id === exceptId) continue;
      try { p.transport.send(msg); } catch (e) { }
    }
  }
  // 按视角序列化: 玩家看不到己方未翻暗子; 观战者所有暗子不可见
  viewFor(role) {
    const data = serialize(this.state);
    const hide = (pc) => { if (pc[4]) pc[3] = '?'; };
    if (role === 'spec') {
      for (const pc of data.pieces) hide(pc);
      if (data.initialPerms) { data.initialPerms.r = {}; data.initialPerms.b = {}; for (const k of JIEQI_SLOTS.r) data.initialPerms.r[k] = '?'; for (const k of JIEQI_SLOTS.b) data.initialPerms.b[k] = '?'; }
    } else if (role === 'b') {
      for (const pc of data.pieces) if (pc[4] && pc[2] === 'b') pc[3] = '?';
      if (data.initialPerms) for (const k of JIEQI_SLOTS.b) data.initialPerms.b[k] = '?';
    }
    return data;
  }
}

// ============================================================
// GuestRoom (加入者=黑方或观战者)
// ============================================================
class GuestRoom {
  /**
   * @param {object} [opts]
   * @param {boolean} [opts.reconnect=false]  是否断线重连(携带持久令牌, 请求房主按原席位恢复)
   * @param {string}  [opts.peerToken=null]  上一局从 helloAck 拿到的重连令牌
   */
  constructor(transport, { name = '棋友', want = 'play', reconnect = false, peerToken = null } = {}) {
    this.transport = transport;
    this.name = name;
    this.want = want;
    this.reconnect = !!reconnect;
    this.peerToken = peerToken;
    this.state = null;
    this.seat = null;
    this.rules = null;
    this.clock = null;
    this.hostName = '';
    this.mySide = null;       // 'b' (对战) 或 'spec'
    this.permOpp = null;     // 我为对手方生成的排列(我执黑 => 红方排列)
    this.saltOpp = null; this.commitOpp = null;
    this.commitHost = null;  // host 对黑方排列的承诺
    this.evt = [];
    this.dead = false;
    transport.onMessage = (m) => { if (!this.dead) this.handle(m).catch(e => this.emit('error', { message: String(e) })); };
    // 突兀关闭(未收到 bye) => 视为网络中断, 交重连状态机处理; 而非"房主已解散"
    transport.onClose = () => { if (!this.dead) this.emit('peerDropped', {}); };
    transport.send({ type: 'hello', name, want, reconnect: !!reconnect, token: peerToken });
  }
  onEvent(cb) { this.evt.push(cb); }
  emit(type, data = {}) { if (this.dead) return; for (const cb of this.evt) cb({ type, ...data }); }
  send(o) { if (this.dead) return; try { this.transport.send(o); } catch (e) { } }
  // 主动离开/会话销毁: 摘除传输回调与全部监听, 使此后的异步 close/消息不再驱动已销毁的对局
  destroy() {
    this.dead = true;
    try { if (this.transport) { this.transport.onMessage = null; this.transport.onClose = null; } } catch (e) { }
    this.evt.length = 0;
  }

  async handle(m) {
    switch (m.type) {
      case 'helloAck':
        this.hostName = m.hostName; this.rules = m.room.rules;
        if (m.peerToken) this.peerToken = m.peerToken;  // 缓存令牌, 供下次断线重连凭它找回原席位
        this.emit('helloAck', m);
        break;
      case 'bye':
        // 房主/对手主动离开: 干净收尾, 不进入重连流程
        this.emit('peerLeft', { reason: m.reason || 'host-left' });
        break;
      case 'joined':
        this.seat = m.role; this.mySide = m.role;
        this.emit('joined', m);
        break;
      case 'joinDeclined':
        this.emit('joinDeclined', m); break;
      case 'jieqiBegin': {
        this.commitHost = m.commit;
        const oppSide = m.yourSide === 'b' ? 'r' : 'b';
        const rng = mulberry32((Math.random() * 4294967296) >>> 0);
        this.permOpp = genPerm(oppSide, rng);
        this.saltOpp = randomSalt();
        this.commitOpp = await sha256(this.saltOpp + JSON.stringify(this.permOpp));
        if (this.dead) return;
        this.send({ type: 'jieqiReady', commit: this.commitOpp });
        break;
      }
      case 'startGame':
      case 'snapshot': {
        this.seat = m.seat || this.seat;
        this.rules = m.rules || this.rules;
        this.clock = m.clock;
        if (this.rules && this.rules.jieqi && this.permOpp) {
          const oppSide = this.mySide === 'b' ? 'r' : 'b';
          m.state.initialPerms = m.state.initialPerms || { r: {}, b: {} };
          if (this.mySide !== 'spec') Object.assign(m.state.initialPerms[oppSide], this.permOpp);
        }
        this.state = restore(m.state);
        this.emit('snapshot', { state: this.state, seat: this.seat, start: m.type === 'startGame' });
        break;
      }
      case 'move': {
        if (!this.state) break;
        const revealT = m.reveal ? m.reveal.t : null;
        const mv = applyMove(this.state, m.from, m.to, revealT ? { revealT } : {});
        this.clock = m.clock;
        this.emit('move', { side: m.actor, move: mv, raw: m });
        if (m.status !== 'playing') { this.state.status = m.status; this.state.reason = m.reason; this.emit('end', { status: m.status, reason: m.reason }); }
        break;
      }
      case 'needReveal': {
        const t = this.permOpp ? this.permOpp[pk(m.from[0], m.from[1])] : null;
        this.send({ type: 'reveal', from: m.from, to: m.to, t });
        break;
      }
      case 'undoReq': this.emit('undoPending', m); break;
      case 'undoReply': this.emit('undoReply', m); break;
      case 'undoDeclined': this.emit('undoDeclined', m); break;
      case 'drawReq': this.emit('drawPending', m); break;
      case 'drawReply': this.emit('drawReply', m); break;
      case 'drawDeclined': this.emit('drawDeclined', m); break;
      case 'end': {
        let hostValid = null;
        if (m.revealHost) {
          const h = await sha256(m.revealHost.salt + JSON.stringify(m.revealHost.perm));
          if (this.dead) return; // await 期间房间已销毁, 不再写状态/发终局
          hostValid = (h === this.commitHost);
          if (hostValid && this.state) { // 公开对方排列, 供复盘揭示
            this.state.initialPerms = this.state.initialPerms || { r: {}, b: {} };
            Object.assign(this.state.initialPerms.b, m.revealHost.perm);
          }
        }
        if (this.state) { this.state.status = m.status; this.state.reason = m.reason; }
        this.emit('end', { ...m, hostValid });
        if (m.wantReveal && this.saltOpp) {
          this.send({ type: 'revealAll', side: this.mySide === 'b' ? 'r' : 'b', salt: this.saltOpp, perm: this.permOpp });
        }
        break;
      }
      case 'revealAll':
        this.emit('revealAll', m); break;
      case 'chat': this.emit('chat', m); break;
      case 'peerOffline': this.emit('peerOffline', m); break;
      case 'peerBack': this.emit('peerBack', m); break;
      case 'specIn': this.emit('specIn', m); break;
      case 'reconnected':
        this.seat = m.role; this.mySide = m.role; this.emit('reconnected', m); break;
      case 'illegalMove': this.emit('illegalMove', m); break;
      case 'clock': this.clock = m.clock; this.emit('clock', m); break;
      default: this.emit('message', m);
    }
  }

  // 主动离开: 先告知房主"我是主动离开"(区别于网络中断), 再销毁
  leave() {
    try { this.send({ type: 'bye' }); } catch (e) { }
    this.destroy();
  }
  localMove(from, to) {
    if (!this.state || this.state.status !== 'playing' || this.seat !== 'b') return { ok: false };
    if (this.state.turn !== 'b') return { ok: false };
    const legal = legalTargetsFrom(this.state, from[0], from[1]).some(t => t[0] === to[0] && t[1] === to[1]);
    if (!legal) return { ok: false, illegal: true };
    this.send({ type: 'move', from, to });
    return { ok: true, waiting: true };
  }
  replyUndo(agree) { this.send({ type: 'undoReply', agree }); }
  replyDraw(agree) { this.send({ type: 'drawReply', agree }); }
  undoReq() { this.send({ type: 'undoReq' }); }
  drawReq() { this.send({ type: 'drawReq' }); }
  resign() { this.send({ type: 'resign' }); }
  sendChat(text) { this.send({ type: 'chat', text: String(text || '').slice(0, 80) }); }
}

// Loopback 传输对(自动化测试用)
function loopbackPair() {
  let a2b = [], b2a = [];
  const flush = () => {
    const aa = a2b; a2b = []; for (const o of aa) b.onMessage && b.onMessage(o);
    const bb = b2a; b2a = []; for (const o of bb) a.onMessage && a.onMessage(o);
  };
  const a = { id: 'la', name: 'A', send(o) { a2b.push(JSON.parse(JSON.stringify(o))); queueMicrotask(flush); }, onMessage: null, onClose: null, close() { b.onClose && b.onClose(); } };
  const b = { id: 'lb', name: 'B', send(o) { b2a.push(JSON.parse(JSON.stringify(o))); queueMicrotask(flush); }, onMessage: null, onClose: null, close() { a.onClose && a.onClose(); } };
  return [a, b];
}

/* ===== js/xq-clock.js ===== */
// ============================================================
// XQClock: 对局时钟(纯逻辑, 可在 node 自测)
// 规则模型与 room.js TIME_RULES 对齐: { base, inc, byo } (单位: 秒)
//   base>0   : 双方初始包干秒数
//   inc>0    : 每走一手给刚走完方加 inc 秒(加秒制)
//   byo>0    : 主时间耗尽后进入读秒, 每手 byo 秒, 读秒耗尽判负
// 双方独立钟, 仅"行棋方"扣时; 落子由 settle() 结算刚走完方。
// 时间源可注入 opts.now() -> ms 时间戳, 便于 node 假时钟测试。
// ESM, 无 DOM 依赖; 浏览器侧由 game-controller 驱动 setInterval。
// ============================================================

// rule: TIME_RULES 的值 {label?, base, inc, byo}(秒); opts.now 时间源
function XQMakeClock(rule, opts = {}) {
  const now = (typeof opts.now === 'function') ? opts.now : () => Date.now();
  const baseMs = Math.round((rule && rule.base || 0) * 1000);
  const incMs = Math.round((rule && rule.inc || 0) * 1000);
  const byoMs = Math.round((rule && rule.byo || 0) * 1000);
  // 无主时间 = 不计时
  if (!baseMs) return XQNullClock();

  const mk = () => ({ remain: baseMs, phase: 'base' });
  const st = { r: mk(), b: mk() };
  let lastTs = now();

  const self = {
    running: true,
    rule,
    // 视图: { r:{remain,phase}, b:{remain,phase}, rule } —— 与原 this._clk 形状一致
    view() { return { r: st.r, b: st.b, rule }; },
    // 刚走完的一方结算: 扣掉本次思考耗时, 加每手加秒; 主时耗尽则进入读秒
    settle(moverSide) {
      const c = st[moverSide]; if (!c) return;
      const t = now();
      const elapsed = t - lastTs; lastTs = t;
      if (c.phase === 'byo') { c.remain = byoMs; return; } // 读秒手: 重置读秒
      c.remain -= elapsed;
      if (incMs) c.remain += incMs;
      if (c.remain <= 0 && byoMs) { c.phase = 'byo'; c.remain = byoMs; }
    },
    // 推进行棋方时钟; 返回超时判负方('r'/'b')或 null(继续)
    tick(turnSide) {
      const c = st[turnSide]; if (!c) return null;
      const t = now();
      const left = c.remain - (t - lastTs);
      lastTs = t;
      if (c.phase === 'byo') {
        if (left <= 0) return turnSide; // 读秒耗尽
        c.remain = left; return null;
      }
      c.remain = left;
      if (left <= 0) {
        if (byoMs) { c.phase = 'byo'; c.remain = byoMs; }
        else return turnSide; // 包干耗尽判负
      }
      return null;
    },
    // 悔棋/回退时把钟恢复到某快照(避免悔棋后时间错乱)
    snapshot() { return { r: { ...st.r }, b: { ...st.b }, lastTs }; },
    restore(s) {
      if (!s) return;
      st.r = { ...s.r }; st.b = { ...s.b }; lastTs = s.lastTs;
    }
  };
  return self;
}

// 不计时时钟: 所有调用空转, 永不超时
function XQNullClock() {
  return {
    running: false,
    rule: null,
    view() { return null; },
    settle() { },
    tick() { return null; },
    snapshot() { return null; },
    restore() { }
  };
}

// 毫秒 -> "mm:ss" 文本(供 UI/导出); byo 前缀由调用方决定
function XQFmtClock(ms) {
  if (ms == null || ms < 0) return '--:--';
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60), ss = s % 60;
  return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}

/* ===== js/xq-game-actions.js ===== */
// ============================================================
// XQGameActions: 悔棋 / 求和 / 认输 的纯决策策略(无 DOM, 可 node 测)
// 与 game-controller 的各模式状态机对应:
//   ai    人机        local 同台双人    puzzle 残局    free 自由练习    lan 联机
// 联机(lan)的悔棋/求和走 room.js 既有"请求-同意"协议, 本模块不碰 net 文件,
//   controller 侧仅在收到房间事件后把 this.state=this.room.state 做本地回退。
// ============================================================

// 悔棋应撤回的半回合数(plies)。
// { mode, state, mySide } -> { n, pair:bool }
//   pair=true 表示撤回的是"玩家+AI"成对两着(人机/残局撤完轮到玩家)。
function XQUndoPlan({ mode, state, mySide } = {}) {
  const total = (state && state.moves) ? state.moves.length : 0;
  if (!total) return { n: 0, pair: false };
  // 同台双人 / 自由练习: 撤回上一步(一着)
  if (mode === 'local' || mode === 'free') return { n: Math.min(1, total), pair: false };
  // 人机 / 残局: 轮到我方(刚由 AI/对手走完) -> 撤一对(玩家+AI), 撤完仍由我方行棋;
  //              我方刚走完、对方在思考 -> 只撤我方这一手, 回到我方行棋。
  if (mode === 'ai' || mode === 'puzzle') {
    const toUs = state.turn === mySide;
    const n = toUs ? Math.min(2, total) : Math.min(1, total);
    return { n, pair: toUs && n === 2 };
  }
  // 联机由房间协议决定撤回数(通常 n=2 双方各一手); controller 不调用本函数
  return { n: 0, pair: false };
}

// 求和流程:
//   direct  人机/自由练习: 玩家提议即判和(双方协商和棋 agreement)
//   confirm 同台双人: 任一方点和 -> 弹"双方同意和棋"确认 -> 作和
//   request 联机: 发和棋请求, 对方同意才作和(room 协议)
//   none    残局: 不提供和棋
function XQDrawFlow(mode) {
  if (mode === 'ai' || mode === 'free') return 'direct';
  if (mode === 'local') return 'confirm';
  if (mode === 'lan') return 'request';
  return 'none';
}

// 认输结果。非同台: 认输方即 mySide, 对方胜。
// 返回 { status, reason } 或 'pick-side'(同台需先选红/黑哪方认输)
function XQResignResult({ mode, mySide } = {}) {
  if (mode === 'local') return 'pick-side';
  const loser = mySide || 'r';
  return { status: loser === 'r' ? 'blackwin' : 'redwin', reason: 'resign' };
}

// 终局是否应入库战绩(与原规则一致: 未走任何棋不入库; 观战/自由练习不入库)
function XQShouldRecord({ mode, mySide, plies } = {}) {
  if (mode === 'free') return false;          // 自由练习不记
  if (mySide === 'spec') return false;        // 观战不记
  if (!(plies > 0)) return false;             // 没走子不记
  if (mode === 'puzzle') return false;        // 残局走进度, 不走对局战绩
  return true;
}

// 终局原因中文短名(导出/记录用)
const XQReasonText = {
  checkmate: '将死', stalemate: '困毙', perpetual: '长将判负',
  repetition: '三次重复和棋', nocapture: '连续40回合无吃子和棋',
  timeout: '超时判负', resign: '认输', offline: '断线超时判负', agreement: '双方协商和棋'
};

/* ===== js/xq-records.js ===== */
// ============================================================
// XQRecords: 对局战绩组装 + 本地持久化桥接(仅本机 localStorage)
// 存储键沿用 storage.js 的 xq_records_v1(战绩/棋谱), 与 screen-records 展示、
//   analyzeRecord 复盘分析共用同一份数据; 本模块只负责"组装一条完整战绩"与薄封装。
// 记录字段: 模式/先后手/引擎类型/等级/胜负和原因/用时/手数/着法/日期/初始局面。
// ============================================================


// 把引擎着法裁剪为可回放的精简形式(复盘/导出/分析共用)
function XQTrimMoves(moves = []) {
  return moves.map(m => ({
    from: m.from, to: m.to, notation: m.notation,
    reveal: m.reveal ? { pos: m.reveal.pos, t: m.reveal.t } : null
  }));
}

// 组装一条战绩。
// ctx: { mode(中文名), result, reason, state, cfg, mySide, durationMs, at }
function XQBuildRecord(ctx = {}) {
  const { state, cfg = {} } = ctx;
  const moves = XQTrimMoves(state.moves || []);
  return {
    mode: ctx.mode || '',
    side: ctx.mySide || null,                 // 先后手 'r'|'b' (同台/联机双方均有)
    result: ctx.result || '',                 // 胜/负/和棋/红胜/黑胜
    reason: ctx.reason || '',                 // 引擎/终局原因 key
    jieqi: !!cfg.jieqi,
    time: cfg.time || 'none',                 // 计时规则 id
    aiLevel: cfg.aiLevel ?? null,            // 人机等级 1..5
    aiEngine: cfg.aiEngine || null,          // classic | pro
    plies: moves.length,                      // 总手数
    durationMs: Math.max(0, Math.round(ctx.durationMs || 0)), // 对局用时
    moves,                                    // 精简着法(可回放/可导出)
    fen: state.initialFen || null,           // 初始 FEN(残局/排局)
    seed: state.seed,                        // 揭棋随机种子
    at: ctx.at || Date.now()
  };
}

// 保存一条战绩(store 自动补 id/at, 仅留最近 100 条)
function XQSaveRecord(rec) { return store.saveRecord(rec); }

// 战绩列表(新->旧排序由调用方决定; 此处返回 store 原始顺序: 新在前)
function XQListRecords() { return store.records(); }

function XQRemoveRecord(id) { return store.removeRecord(id); }
function XQClearRecords() { return store.clearRecords(); }

// 序列化往返自检(纯数据, 不碰 localStorage): 构造 -> 经 JSON 往返 -> 字段齐全
function XQRoundTrip(rec) {
  const s = JSON.parse(JSON.stringify(rec));
  const need = ['mode', 'result', 'reason', 'plies', 'moves', 'fen', 'seed', 'at'];
  return need.every(k => k in s) && Array.isArray(s.moves) && s.moves.length === rec.plies;
}

/* ===== js/xq-exporter.js ===== */
// ============================================================
// XQExporter: 整局中文标准棋谱导出(纯文本, 离线, 无外链)
//   - 由引擎着法(notation) 生成标准中文记谱棋谱, 含开局名/结果/手数
//   - 开局识别: 与 OPENINGS 库按前缀(经 canon 归一)匹配最具体者
//   - 复制到剪贴板 / 可选 navigator.share 分享纯文本
//   - 回放校验: 导出的着法文本可被 notation.js 互逆还原并由引擎重放
// 纯逻辑函数(DetectOpening/ExportText/ReplayCheck)无 DOM, 可 node 测;
//   CopyText/ShareText 仅浏览器调用(延迟引用 navigator/document)。
// ============================================================




// 终局原因短名(与 controller REASON_TEXT / records 一致)
const REASON = {
  checkmate: '将死', stalemate: '困毙', perpetual: '长将判负',
  repetition: '三次重复和棋', nocapture: '连续40回合无吃子和棋',
  timeout: '超时判负', resign: '认输', offline: '断线超时判负', agreement: '双方协商和棋'
};

// 识别开局: 着法 notation 序列与 OPENINGS 前缀最长匹配。
// 至少匹配 4 手(2 回合)才认定, 避免把"炮二平五"这类单步误报。
// jieqi/自定义 FEN(残局/排局) 不识别开局。
function XQDetectOpening(moves = [], { jieqi = false, fen = null } = {}) {
  if (jieqi || fen || !moves.length) return '';
  const got = moves.map(m => canon(m.notation || ''));
  let best = '', bestLen = 0;
  for (const op of OPENINGS) {
    if (op.fen) continue; // 排局/古谱从 FEN 摆起, 不匹配常规开局
    const want = op.moves.map(canon);
    let l = 0;
    while (l < want.length && l < got.length && want[l] === got[l]) l++;
    if (l > bestLen) { bestLen = l; best = op.name; }
  }
  return bestLen >= 4 ? best : '';
}

// 生成整局标准中文棋谱纯文本。
// opt: { moves, result, reason, mode, jieqi, fen, seed, time, at, opening }
function XQExportText(opt = {}) {
  const moves = opt.moves || [];
  const d = new Date(opt.at || Date.now());
  const p2 = n => String(n).padStart(2, '0');
  const opening = opt.opening || XQDetectOpening(moves, { jieqi: opt.jieqi, fen: opt.fen });
  const reasonTxt = REASON[opt.reason] || opt.reason || '';
  const head = [
    '【中国象棋对局棋谱】',
    '时间: ' + `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`,
    opt.mode ? '对局: ' + opt.mode : '',
    '玩法: ' + (opt.jieqi ? '揭棋' : '经典'),
    opening ? '开局: ' + opening : '',
    '结果: ' + (opt.result || '未终局') + (reasonTxt ? '(' + reasonTxt + ')' : ''),
    '手数: ' + moves.length + ' 手 / ' + Math.ceil(moves.length / 2) + ' 回合',
    ''
  ].filter(Boolean);

  const rows = [];
  for (let i = 0; i < moves.length; i += 2) {
    const no = String(i / 2 + 1).padStart(2, ' ');
    const r = (moves[i] && moves[i].notation) || '';
    const b = (moves[i + 1] && moves[i + 1].notation) || '';
    rows.push(no + '. ' + r.padEnd(7, '　') + b);
  }
  return head.join('\n') + '\n' + rows.join('\n');
}

// 回放校验: 用导出的 notation 逐条经 notation.parseMove 还原并 applyMove,
// 断言每手 from/to 与原始着法一致。经典满盘开局之外局面也能自洽。
function XQReplayCheck(moves = [], { jieqi = false, fen = null, seed = 0 } = {}) {
  const s = createState({ jieqi, fen, seed });
  for (const m of moves) {
    const p = parseMove(s, m.notation);
    if (!p || p.from[0] !== m.from[0] || p.from[1] !== m.from[1]
      || p.to[0] !== m.to[0] || p.to[1] !== m.to[1]) return false;
    applyMove(s, p.from, p.to, { revealT: m.reveal ? m.reveal.t : null });
  }
  return true;
}

// ---- 以下为浏览器侧副作用 API(node 不调用) ----
// 复制到剪贴板(含 execCommand 兜底); 成功返回 true
async function XQCopyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text); return true;
    }
    throw new Error('no clipboard api');
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      ta.remove(); return ok;
    } catch (e2) { return false; }
  }
}

// 调用系统分享纯文本(不支持则返回 false, 由调用方回退复制)
async function XQShareText(text) {
  try {
    if (navigator.share) { await navigator.share({ text }); return true; }
  } catch (e) { /* 用户取消/不支持 */ }
  return false;
}

/* ===== js/ai-spectate.js ===== */
// ============================================================
// 观战 AI 对战: 纯逻辑状态机(无 DOM/无 worker)
//   - 持红/黑两方各自配置 {engine, level}, 按当前回合方轮流驱动 AI;
//   - play/pause/step(暂停态单步一手)/speed(每手间隔)/restart/换配置;
//   - 终局/着法/循环判和一律由注入的 applyFn(复用 engine)判定, 本模块不另写规则;
//   - 健壮性: aiCall 超时兜底已在注入层; 本模块再设最大手数保护, 某方回 null 用
//     fallbackFn 兜底, 绝不死循环卡死。
// 顶层符号统一 XQSpec* 前缀, 避开 build checkDup。
// ============================================================

// 播放速度 -> 每手间隔 ms(慢/中/快)
const SPEC_SPEEDS = { slow: 900, mid: 420, fast: 160 };
// 最大手数保护: 防双方无限拉锯(无吃子和棋应更早触发, 这里再兜一层)
const SPEC_MAX_MOVES = 260;

class XQSpectate {
  // opts:
  //   red, black : {engine:'classic'|'pro', level:1-5}
  //   aiCallFn(side, engine, level) -> Promise<mv|null>   (注入, 内部已含超时兜底)
  //   fallbackFn(side) -> mv|null                          (某方回 null 时取一个合法着)
  //   applyFn(mv, side) -> {over, status, reason, nextSide} (注入: 落子+记谱+判终局)
  //   onEnd({status, reason})                              (终局回调)
  //   speed: 'slow'|'mid'|'fast'
  constructor(opts = {}) {
    this.cfg = {
      red: { engine: opts.red?.engine === 'pro' ? 'pro' : 'classic', level: this._lvl(opts.red?.level) },
      black: { engine: opts.black?.engine === 'pro' ? 'pro' : 'classic', level: this._lvl(opts.black?.level) }
    };
    this.aiCallFn = opts.aiCallFn || (async () => null);
    this.fallbackFn = opts.fallbackFn || (() => null);
    this.applyFn = opts.applyFn || (() => ({ over: true, status: 'draw', reason: 'spec-nofn', nextSide: 'r' }));
    this.onEnd = opts.onEnd || (() => {});
    this.setSpeed(opts.speed);
    this.paused = false;
    this.moveCount = 0;
    this.running = false;
    this.side = 'r';          // 当前轮到的 AI
    this._timer = null;
    this._busy = false;
  }
  _lvl(v) { v = +v; return v >= 1 && v <= 5 ? v : 3; }
  cfgFor(side) { return this.cfg[side === 'b' ? 'black' : 'red']; }
  setSpeed(s) { if (SPEC_SPEEDS[s]) this.speed = s; else this.speed = 'mid'; }
  waitMs() { return SPEC_SPEEDS[this.speed]; }
  get over() { return !this.running; }

  start() {
    if (this.running) return;
    this.running = true;
    this._kick();
  }
  stop() {
    this.running = false;
    if (this._timer) { clearTimeout(this._timer); this._timer = null; }
  }
  setPaused(p) {
    this.paused = !!p;
    if (!this.paused) this._kick();
  }
  // 换配置并重置到开局(由外层重建 state 后调用)
  reset(red, black, speed) {
    this.stop();
    if (red) this.cfg.red = { engine: red.engine === 'pro' ? 'pro' : 'classic', level: this._lvl(red.level) };
    if (black) this.cfg.black = { engine: black.engine === 'pro' ? 'pro' : 'classic', level: this._lvl(black.level) };
    if (speed) this.setSpeed(speed);
    this.paused = false; this.moveCount = 0; this.side = 'r'; this._busy = false;
  }
  _kick() {
    if (!this.running || this.paused || this._busy || this._timer != null) return;
    this._timer = setTimeout(() => { this._timer = null; this._tick(); }, this.waitMs());
  }
  async _tick() {
    if (!this.running || this._busy) return;
    this._busy = true;
    const side = this.side;
    const ai = this.cfgFor(side);
    let mv = null;
    try { mv = await this.aiCallFn(side, ai.engine, ai.level); } catch (e) { mv = null; }
    // 到点/异常后若已 stop(退出/换配置), 放弃, 不污染旧局面
    if (!this.running) { this._busy = false; return; }
    if (!mv) { try { mv = this.fallbackFn(side); } catch (e) { mv = null; } }
    if (!mv) { // 无任何合法着 -> 判负(对方胜), 绝不死循环
      this._busy = false; this.stop();
      this.onEnd({ status: side === 'r' ? 'blackwin' : 'redwin', reason: 'spec-nomove' });
      return;
    }
    let res = { over: true, status: 'draw', reason: 'spec-nofn', nextSide: side === 'r' ? 'b' : 'r' };
    try { res = this.applyFn(mv, side) || res; } catch (e) { res = { over: true, status: 'draw', reason: 'spec-applyerr', nextSide: side === 'r' ? 'b' : 'r' }; }
    this.moveCount++;
    this._busy = false;
    if (res.over) { this.stop(); this.onEnd({ status: res.status, reason: res.reason }); return; }
    if (this.moveCount >= SPEC_MAX_MOVES) { this.stop(); this.onEnd({ status: 'draw', reason: 'spec-maxmoves' }); return; }
    this.side = res.nextSide;
    this._kick();
  }
  // 暂停态手动单步: 恰好推进一手; 非暂停态忽略(避免与自动循环重复触发)
  stepOnce() {
    if (!this.running || !this.paused || this._busy) return Promise.resolve(false);
    this._timer = null;
    return this._tick().then(() => true);
  }
}

/* ===== js/puzzle-ai-demo.js ===== */
// ============================================================
// 残局 AI 演示 / 双 AI 对弈(复用观战 XQSpectate 调度)
//   - 从残局 FEN 自动演到终局; 攻击方(通常红, 先手)与防守方分工:
//     * solver 模式(AI演示正解): 攻击方走"确定性强制杀/主变"求解(注入的 solverFn,
//       即 worker puzzleHint: sol-maps/findForcedMate 最短杀), 防守方用最强 AI 最顽强应对;
//     * double 模式(双AI对弈): 双方各按自选引擎+档位走 normal 搜索;
//   - 终局如实判定: 是否按标准 mate 步数将死 / win 取胜 / draw 守和, 绝不伪装成功;
//   - 控制(暂停/单步/调速/重开)直接转发给内部 XQSpectate, 复用其超时/null 兜底+最大手数。
// 顶层符号 XQPuzDemo / XQPD* 前缀, 避开 build checkDup。
// 不重写引擎规则/求解器: solverFn 与 engineFn 由外部(controller 经 worker)注入。
// ============================================================



// 残局演示手数上限(远短于自由对弈, 残局应较快收敛)
const PUZDEMO_MAX_MOVES = 140;

// 残局演示终局判定: 如实给出"成功/失败/和"与步数对比文案, 绝不谎报。
//   opts: {mode:'solver'|'double', type:undefined|'win'|'draw', attacker, mateTarget, status, reason, plies}
// 返回 {ok:boolean, title, sub, pass:null|'win'|'draw'|'fail'}
function XQPDVerdict(opts = {}) {
  const { type, attacker = 'r' } = opts;
  const plies = opts.plies || 0;
  const rounds = Math.ceil(plies / 2);
  const status = opts.status; // redwin / blackwin / draw
  // 攻击方是否达成目标
  const attackerWon = status === (attacker === 'r' ? 'redwin' : 'blackwin');
  const defenderHeld = status === 'draw' || (status === (attacker === 'r' ? 'blackwin' : 'redwin'));
  // ---- 守和定式(type=draw, 攻击方=红, 防守目标=弱方黑不败)----
  if (type === 'draw') {
    // 演示弱方(黑)如何守: 红不胜(和)即守和成功
    const held = status === 'draw' || status === 'blackwin';
    return held
      ? { ok: true, pass: 'draw', title: '守和成功(成和)', sub: '弱方在限定内守住红方进攻, 共 ' + rounds + ' 回合' }
      : { ok: false, pass: 'fail', title: '防守被攻破', sub: '红方进攻得手, 共 ' + rounds + ' 回合; 可自行研究更稳的防守形' };
  }
  // ---- 例胜定式(type=win, 攻击方=红)----
  if (type === 'win') {
    return attackerWon
      ? { ok: true, pass: 'win', title: '演示取胜', sub: '攻击方运子得手, 共 ' + rounds + ' 回合' }
      : { ok: false, pass: 'fail', title: '未能在限定手数内演示取胜', sub: status === 'draw' ? '演成和棋, 可自行研究' : '被反胜, 可自行研究' };
  }
  // ---- 杀局(无 type, mate=N): 攻击方红须在 mateTarget 步内将死 ----
  const mateTarget = opts.mateTarget || 0;
  if (attackerWon) {
    const ok = !mateTarget || rounds <= mateTarget;
    return {
      ok, pass: 'win',
      title: ok ? '标准 ' + mateTarget + ' 步将死 · 实际 ' + rounds + ' 步' : '将死成功 · 实际 ' + rounds + ' 步(标注 ' + mateTarget + ')',
      sub: ok ? '按题目标注步数最短将死' : '虽将死但超过标注步数, 见求解器分支'
    };
  }
  return {
    ok: false, pass: 'fail',
    title: '未能按正解将死',
    sub: status === 'draw' ? '演成和棋(防守最顽强/求解未在限内得解), 共 ' + rounds + ' 回合'
      : '攻击方被反杀, 共 ' + rounds + ' 回合; 正解求解超时或未取到主变'
  };
}

// 残局演示驱动: 内部包一个 XQSpectate, 按"当前回合方是否攻击方"选择 solver/engine 请求。
class XQPuzDemo {
  // opts:
  //   attacker: 'r'(默认先手红)
  //   mode: 'solver' | 'double'
  //   solverAiCall() -> Promise<mv|null>   (攻击方确定性求解, controller 注入 puzzleHint worker)
  //   engineAiCall(side, engine, level) -> Promise<mv|null>  (普通引擎落子)
  //   doubleCfg: {red:{engine,level}, black:{engine,level}}   (double 模式双方配置)
  //   defenderLevel: number  (solver 模式防守方强度, 默认 5)
  //   applyFn(mv, side) -> {over,status,reason,nextSide}
  //   fallbackFn(side) -> mv|null
  //   speed: slow|mid|fast
  constructor(opts = {}) {
    this.attacker = opts.attacker === 'b' ? 'b' : 'r';
    this.mode = opts.mode === 'double' ? 'double' : 'solver';
    this.solverAiCall = opts.solverAiCall || (async () => null);
    this.engineAiCall = opts.engineAiCall || (async () => null);
    this.defenderLevel = opts.defenderLevel || 5;
    this.doubleCfg = {
      red: { engine: opts.doubleCfg?.red?.engine === 'pro' ? 'pro' : 'classic', level: +opts.doubleCfg?.red?.level || 3 },
      black: { engine: opts.doubleCfg?.black?.engine === 'pro' ? 'pro' : 'classic', level: +opts.doubleCfg?.black?.level || 3 }
    };
    // 当前回合方 -> 该发什么请求
    const aiCallFn = (side) => {
      if (this.mode === 'solver' && side === this.attacker) return this.solverAiCall();
      // 防守方(solver 模式)或双方(double 模式)走引擎
      let engine = 'classic', level = this.defenderLevel;
      if (this.mode === 'double') {
        const c = side === 'b' ? this.doubleCfg.black : this.doubleCfg.red;
        engine = c.engine; level = c.level;
      }
      return this.engineAiCall(side, engine, level);
    };
    this.spec = new XQSpectate({
      red: this.mode === 'double' ? this.doubleCfg.red : { engine: 'classic', level: 3 },
      black: this.mode === 'double' ? this.doubleCfg.black : { engine: 'classic', level: 5 },
      speed: opts.speed || 'mid',
      aiCallFn,
      fallbackFn: opts.fallbackFn || (() => null),
      applyFn: opts.applyFn || (() => ({ over: true, status: 'draw', reason: 'nofn', nextSide: 'r' })),
      onEnd: (info) => this._onEnd(info)
    });
    this.onEnd = opts.onEnd || (() => {});
  }
  _onEnd(info) {
    this.onEnd({ ...info, plies: this.spec.moveCount });
  }
  get paused() { return this.spec.paused; }
  start() { return this.spec.start(); }
  stop() { return this.spec.stop(); }
  setPaused(p) { return this.spec.setPaused(p); }
  setSpeed(s) { return this.spec.setSpeed(s); }
  stepOnce() { return this.spec.stepOnce(); }
  get moveCount() { return this.spec.moveCount; }
  get speed() { return this.spec.speed; }
}

// ============================================================
// 断线重连状态机(传输无关 / 规则无关, 浏览器与 Node 通用)
//
// 职责:
//   * 观察 ICE / connectionState / DataChannel close 信号, 粗粒度判定链路状态;
//   * 区分两类"断开":
//       - 对方主动离开(收到 bye / pc 被对端干净关闭) -> GONE, 不再尝试重连;
//       - 网络中断(NIC 抖动 / 切 WiFi / mDNS 解析失败 / 瞬时丢包) -> RECONNECTING;
//   * 进入重连中后按次数尝试 ICE restart(onAttemptRestart 由调用方实现:
//     同设备经 BroadcastChannel 中继新 SDP; 跨设备由 UI 提示用户重新扫码,
//     复用 room.js 的 hello{reconnect}+快照回放恢复);
//   * 重连成功(notifyUp)由调用方触发一次快照重同步; 超时放弃 -> GIVEUP。
//
// 不承诺: 跨设备在不重新交换 SDP 的情况下自动穿透已彻底死亡的 UDP 链路 ——
// 纯静态无信令服务器做不到, 跨设备重连必然需要一次手动(扫码/粘贴)动作。
// iceServers 恒为 [], 本模块不产生任何新的网络连接配置。
// ============================================================

const XQNetLinkState = Object.freeze({
  UP: 'up',                       // 已连接
  RECONNECTING: 'reconnecting',  // 重连中(网络中断, 正在尝试恢复)
  GONE: 'gone',                   // 对方主动离开
  GIVEUP: 'giveup'               // 重连超时失败
});

class XQNetReconnector {
  /**
   * @param {object}   [opts]
   * @param {number}   [opts.suspectMs=3500]  disconnected/failed 持续超过该值 -> 判定为网络中断
   * @param {number}   [opts.giveUpMs=45000]  重连总尝试时限, 超过即放弃
   * @param {number}   [opts.maxRestart=2]    最多触发几次 ICE restart
   * @param {object}   [opts.clock]           可注入 {now(),setTimeout,clearTimeout} 便于测试
   */
  constructor({
    suspectMs = 3500, giveUpMs = 45000, maxRestart = 2, clock = null
  } = {}) {
    this.state = XQNetLinkState.UP;
    this.suspectMs = suspectMs;
    this.giveUpMs = giveUpMs;
    this.maxRestart = maxRestart;
    this._restarts = 0;
    this._suspectTimer = null;
    this._giveUpTimer = null;
    // ---- 供调用方挂载的钩子 ----
    this.onTransition = null;       // (state, {prev, recovered, reason}) => {}
    this.onAttemptRestart = null;    // () => void | Promise    执行一次 ICE restart(由调用方实现 SDP 中继)
    this.clock = clock || {
      now: () => Date.now(),
      setTimeout: (fn, ms) => setTimeout(fn, ms),
      clearTimeout: (id) => clearTimeout(id)
    };
  }
  _set(state, info = {}) {
    const prev = this.state;
    this.state = state;
    try { this.onTransition && this.onTransition(state, Object.assign({ prev }, info)); } catch (e) { }
  }

  // 数据通道重新 open / ICE 回到 connected: 视为重连成功
  notifyUp() {
    if (this.state === XQNetLinkState.UP) return;
    this._clearTimers();
    const recovered = this.state === XQNetLinkState.RECONNECTING;
    this._restarts = 0;
    this._set(XQNetLinkState.UP, { recovered });
  }

  // RTCPC.iceConnectionState 观测
  notifyIce(state) {
    if (this.state === XQNetLinkState.GONE || this.state === XQNetLinkState.GIVEUP) return;
    if (state === 'connected' || state === 'completed') {
      if (this.state === XQNetLinkState.RECONNECTING) this.notifyUp();
      return;
    }
    if (state === 'disconnected' || state === 'failed') this._suspect(false);
  }
  // RTCPeerConnection.connectionState 观测
  notifyConn(state) {
    if (this.state === XQNetLinkState.GONE || this.state === XQNetLinkState.GIVEUP) return;
    if (state === 'connected') {
      if (this.state === XQNetLinkState.RECONNECTING) this.notifyUp();
      return;
    }
    if (state === 'disconnected' || state === 'failed') this._suspect(false);
    else if (state === 'closed') this._gone();   // pc 被对端/本地干净关闭
  }
  // 传输层 onClose。clean=true 表示我们已知对方主动离开(收到 bye / 正常关闭)
  notifyClosed({ clean = false } = {}) {
    if (clean) this._gone();
    else this._suspect(true);   // 突兀关闭 -> 按网络中断处理, 直接进入重连中
  }

  _suspect(hard) {
    if (this.state === XQNetLinkState.GONE || this.state === XQNetLinkState.GIVEUP) return;
    if (hard) { this._enterReconnecting(); return; }
    if (this._suspectTimer) return;   // 已在观察期
    this._suspectTimer = this.clock.setTimeout(() => this._enterReconnecting(), this.suspectMs);
  }
  _enterReconnecting() {
    this._clearSuspect();
    if (this.state === XQNetLinkState.GONE || this.state === XQNetLinkState.GIVEUP) return;
    if (this.state === XQNetLinkState.UP) {
      this._set(XQNetLinkState.RECONNECTING, {});
      this._giveUpTimer = this.clock.setTimeout(() => this._giveUp(), this.giveUpMs);
    }
    this._tryRestart();
  }
  _tryRestart() {
    if (this._restarts >= this.maxRestart) return;
    this._restarts++;
    try { this.onAttemptRestart && this.onAttemptRestart(); } catch (e) { }
  }
  _gone() {
    this._clearTimers();
    if (this.state !== XQNetLinkState.GONE) this._set(XQNetLinkState.GONE, {});
  }
  _giveUp() {
    this._clearTimers();
    if (this.state === XQNetLinkState.RECONNECTING) this._set(XQNetLinkState.GIVEUP, { reason: 'timeout' });
  }
  _clearSuspect() { if (this._suspectTimer) { this.clock.clearTimeout(this._suspectTimer); this._suspectTimer = null; } }
  _clearTimers() {
    this._clearSuspect();
    if (this._giveUpTimer) { this.clock.clearTimeout(this._giveUpTimer); this._giveUpTimer = null; }
  }
  destroy() { this._clearTimers(); }
}
